        addT.style.cssText = 'font-size:10px;padding:2px 8px;background:transparent;border:1px dashed var(--border);border-radius:var(--radius-sm);color:var(--text-muted);cursor:pointer;margin:2px 0';
        addT.textContent = '➕ 文本行';
        addT.addEventListener('click', () => {
          textLines.push('');
          d.text = textLines.length === 1 ? textLines[0] : textLines;
          this.markDirty(); this.renderEditor();
        });
        subContainer.appendChild(addT);

        // ══ Conditions (object format: {flag:"x", not_flag:"y", level_ge:10}) ══
        // Normalize: ensure conditions is an object (not array)
        if (Array.isArray(d.conditions)) {
          const obj = {};
          for (const c of d.conditions) {
            if (c.type && c.value !== undefined && c.type !== '') obj[c.type] = c.value;
          }
          d.conditions = obj;
        } else if (typeof d.conditions !== 'object' || d.conditions === null) {
          d.conditions = {};
        }
        const knownCondTypes = ['flag','not_flag','level_ge','level_eq','reputation_ge','reputation_lt','gold_ge','has_item','not_item','quest_done','quest_active','chance'];
        const condEntries = Object.entries(d.conditions);
        const condLabel = document.createElement('div');
        condLabel.style.cssText = 'font-size:10px;font-weight:600;color:var(--orange);margin:6px 0 2px;display:flex;align-items:center;gap:6px';
        condLabel.innerHTML = `<span>🚩 条件 (${condEntries.length})</span>` +
          `<span style="font-size:9px;color:var(--text-muted);font-weight:400">对话何时显示？</span>`;
        subContainer.appendChild(condLabel);

        // Story flag list for autocomplete
        const allFlags = this.collectStoryFlags();

        for (let ci = 0; ci < condEntries.length; ci++) {
          const [ck, cv] = condEntries[ci];
          const condRow = document.createElement('div');
          condRow.style.cssText = 'display:flex;align-items:center;gap:3px;padding:2px 0';

          // Condition type dropdown
          const cSel = document.createElement('select');
          cSel.style.cssText = 'width:100px;padding:2px 4px;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-primary);font-size:10px;outline:none';
          const condOpts = knownCondTypes.map(t =>
            `<option value="${t}" ${ck===t?'selected':''}>${{
              'flag':'🔸 有剧情标记',
              'not_flag':'🔹 无剧情标记',
              'level_ge':'📊 等级≥',
              'level_eq':'📊 等级=',
              'reputation_ge':'⭐ 声望≥',
              'reputation_lt':'⭐ 声望<',
              'gold_ge':'💰 金币≥',
              'has_item':'📦 拥有物品',
              'not_item':'📦 没有物品',
              'quest_done':'📜 任务完成',
              'quest_active':'📜 任务进行中',
              'chance':'🎲 概率'
            }[t]||t}</option>`
          ).join('') + `<option value="${ck}" ${knownCondTypes.includes(ck)?'hidden':''} style="color:var(--warning)">${ck}</option>`;
          cSel.innerHTML = condOpts;
          cSel.addEventListener('change', () => {
            const oldVal = d.conditions[ck];
            delete d.conditions[ck];
            d.conditions[cSel.value] = oldVal;
            this.markDirty();
            this.renderEditor();
          });
          condRow.appendChild(cSel);

          // Value input — use flag autocomplete for flag/not_flag
          if (ck === 'flag' || ck === 'not_flag') {
            const cInp = document.createElement('input');
            cInp.type = 'text'; cInp.value = String(cv ?? '');
            cInp.placeholder = 'flag 名称...';
            cInp.style.cssText = 'flex:1;min-width:80px;padding:2px 5px;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-primary);font-size:10px;outline:none';
            cInp.addEventListener('input', () => { d.conditions[cSel.value] = cInp.value; this.markDirty(); });
            condRow.appendChild(cInp);

            // Quick flag picker (if any flags exist)
            if (allFlags.length > 0) {
              const flagHint = document.createElement('select');
              flagHint.style.cssText = 'max-width:80px;padding:2px 4px;background:var(--bg-tertiary);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-muted);font-size:9px;outline:none';
              let hintHtml = '<option value="">选已有flag</option>';
              for (const f of allFlags) hintHtml += `<option value="${f}">${f}</option>`;
              flagHint.innerHTML = hintHtml;
              flagHint.addEventListener('change', () => {
                if (flagHint.value) {
                  d.conditions[cSel.value] = flagHint.value;
                  cInp.value = flagHint.value;
                  this.markDirty();
                  this.renderEditor();
                }
              });
              condRow.appendChild(flagHint);
            }
          } else {
            // Generic value input
            const isNum = ['level_ge','level_eq','reputation_ge','reputation_lt','gold_ge','chance'].includes(ck);
            const cInp = document.createElement('input');
            cInp.type = 'text'; cInp.value = String(cv ?? '');
            cInp.placeholder = isNum ? '数值...' : '值...';
            cInp.style.cssText = 'flex:1;min-width:50px;padding:2px 5px;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-primary);font-size:10px;outline:none';
            cInp.addEventListener('input', () => { d.conditions[cSel.value] = isNum ? Number(cInp.value)||0 : cInp.value; this.markDirty(); });
            condRow.appendChild(cInp);
          }

          // Delete condition
          const ciDel = document.createElement('button');
          ciDel.className = 'btn-icon btn-sm'; ciDel.textContent = '✕';
          ciDel.style.cssText = 'color:var(--danger);cursor:pointer';
          ciDel.addEventListener('click', () => {
            delete d.conditions[ck];
            this.markDirty(); this.renderEditor();
          });
          condRow.appendChild(ciDel);
          subContainer.appendChild(condRow);
        }

        const addC = document.createElement('div');
        addC.style.cssText = 'display:flex;align-items:center;gap:4px;margin:3px 0';
        const newCondType = document.createElement('select');
        newCondType.style.cssText = 'width:100px;padding:2px 4px;background:var(--bg-input);border:1px dashed var(--border);border-radius:var(--radius-sm);color:var(--text-muted);font-size:10px;outline:none';
        newCondType.innerHTML = knownCondTypes.map(t =>
          `<option value="${t}">${{'flag':'🔸 有剧情标记','not_flag':'🔹 无剧情标记','level_ge':'📊 等级≥','reputation_ge':'⭐ 声望≥','gold_ge':'💰 金币≥','has_item':'📦 拥有物品'}[t]||t}</option>`
        ).join('');
        addC.appendChild(newCondType);
        const addCBtn = document.createElement('button');
        addCBtn.style.cssText = 'padding:2px 10px;background:transparent;border:1px dashed var(--border);border-radius:var(--radius-sm);color:var(--text-muted);cursor:pointer;font-size:10px';
        addCBtn.textContent = '➕ 条件';
        addCBtn.addEventListener('click', () => {
          const t = newCondType.value;
          if (!(t in d.conditions)) {
            d.conditions[t] = t === 'chance' ? 0.5 : (['flag','not_flag','has_item','not_item'].includes(t) ? '' : 0);
            this.markDirty(); this.renderEditor();
          }
        });
        addC.appendChild(addCBtn);
        subContainer.appendChild(addC);

        // ══ Actions (context-aware) ══
        const actLabel = document.createElement('div');
        actLabel.style.cssText = 'font-size:10px;font-weight:600;color:var(--cyan);margin:8px 0 2px;display:flex;align-items:center;gap:6px';
        actLabel.innerHTML = `<span>⚡ 动作 (${d.actions.length})</span>` +
          `<span style="font-size:9px;color:var(--text-muted);font-weight:400">对话后触发什么？</span>`;
        subContainer.appendChild(actLabel);

        // Action type config: input fields each type needs
        const actTypeConfig = {
          'set_flag':        { label:'设置剧情标记', fields:['key','value'], keyLabel:'flag名', valLabel:'值(0/1)', valDefault:1 },
          'add_reputation':  { label:'增加声望', fields:['value','message'], valLabel:'声望值', valDefault:20 },
          'add_gold':        { label:'增加金币', fields:['value','message'], valLabel:'金币数', valDefault:100 },
          'remove_gold':     { label:'扣除金币', fields:['value','message'], valLabel:'金币数', valDefault:100 },
          'heal':            { label:'治疗玩家', fields:['value'], valLabel:'治疗量', valDefault:50 },
          'message':         { label:'显示消息', fields:['message'], keyLabel:'无' },
          'open_shop':       { label:'打开商店', fields:['key'], keyLabel:'商店ID' },
          'open_craft':      { label:'打开打造', fields:[], noValue:true },
          'open_quests':     { label:'打开任务', fields:[], noValue:true },
          'open_skills':     { label:'打开技能', fields:[], noValue:true },
          'teleport':        { label:'传送玩家', fields:['key','value'], keyLabel:'地图', valLabel:'X,Y', valDefault:'0,0' },
          'complete_quest':  { label:'完成任务', fields:['key'], keyLabel:'任务ID' },
          'start_quest':     { label:'接取任务', fields:['key'], keyLabel:'任务ID' },
          'add_item':        { label:'给予物品', fields:['key','value'], keyLabel:'物品ID', valLabel:'数量', valDefault:1 },
          'remove_item':     { label:'移除物品', fields:['key','value'], keyLabel:'物品ID', valLabel:'数量', valDefault:1 },
          'set_level':       { label:'设置等级', fields:['value'], valLabel:'等级', valDefault:1 },
          'set_npc_flag':    { label:'设置NPC标记', fields:['key','value'], keyLabel:'NPC名', valLabel:'值', valDefault:1 },
        };

        for (let ai = 0; ai < d.actions.length; ai++) {
          const actRow = document.createElement('div');
          actRow.style.cssText = 'padding:3px 4px;background:var(--bg-tertiary);border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:3px';
          const actInner = document.createElement('div');
          actInner.style.cssText = 'display:flex;align-items:center;gap:4px';

          const aSel = document.createElement('select');
          const actKeys = Object.keys(actTypeConfig);
          aSel.innerHTML = actKeys.map(t =>
            `<option value="${t}" ${d.actions[ai].type===t?'selected':''}>${actTypeConfig[t].label}</option>`
          ).join('') +
            (!actKeys.includes(d.actions[ai].type) && d.actions[ai].type ?
              `<option value="${d.actions[ai].type}" selected style="color:var(--warning)">${d.actions[ai].type}</option>` : '');
          aSel.style.cssText = 'width:100px;padding:2px 4px;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-primary);font-size:10px;outline:none;flex-shrink:0';
          aSel.addEventListener('change', () => {
            d.actions[ai].type = aSel.value;
            this.markDirty();
            this.renderEditor();
          });
          actInner.appendChild(aSel);

          // Dynamic fields based on action type
          const cfg = actTypeConfig[d.actions[ai].type] || { fields:['key','value','message'] };
          if (cfg.fields.includes('key')) {
            const kInp = document.createElement('input');
            kInp.value = d.actions[ai].key || '';
            kInp.placeholder = cfg.keyLabel || '标识...';
            kInp.style.cssText = 'flex:1;min-width:50px;padding:2px 5px;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-primary);font-size:10px;outline:none';
            kInp.addEventListener('input', () => { d.actions[ai].key = kInp.value; this.markDirty(); });
            actInner.appendChild(kInp);

            // Flag autocomplete for set_flag
            if (d.actions[ai].type === 'set_flag' && allFlags.length > 0) {
              const flagPick = document.createElement('select');
              flagPick.style.cssText = 'max-width:80px;padding:2px 4px;background:var(--bg-tertiary);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-muted);font-size:9px;outline:none';
              let h = '<option value="">选flag</option>';
              for (const f of allFlags) h += `<option value="${f}">${f}</option>`;
              flagPick.innerHTML = h;
              flagPick.addEventListener('change', () => {
                if (flagPick.value) {
                  d.actions[ai].key = flagPick.value;
                  kInp.value = flagPick.value;
                  this.markDirty();
                  this.renderEditor();
                }
              });
              actInner.appendChild(flagPick);
            }
          }
          if (cfg.fields.includes('value')) {
            let vVal = d.actions[ai].value;
            if (vVal === undefined || vVal === null) vVal = '';
            const vInp = document.createElement('input');
            vInp.type = 'text'; vInp.value = String(vVal);
            vInp.placeholder = cfg.valLabel || '值...';
            vInp.style.cssText = 'width:50px;padding:2px 5px;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-primary);font-size:10px;outline:none;flex-shrink:0';
            vInp.addEventListener('input', () => {
              d.actions[ai].value = isNaN(Number(vInp.value)) ? vInp.value : Number(vInp.value);
              this.markDirty();
            });
            actInner.appendChild(vInp);
          }
          if (cfg.fields.includes('message')) {
            const mInp = document.createElement('input');
            mInp.value = d.actions[ai].message || '';
            mInp.placeholder = '消息文本...';
            mInp.style.cssText = 'flex:1;min-width:60px;padding:2px 5px;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-primary);font-size:10px;outline:none';
            mInp.addEventListener('input', () => { d.actions[ai].message = mInp.value; this.markDirty(); });
            actInner.appendChild(mInp);
          }

          const aDel = document.createElement('button');
          aDel.className = 'btn-icon btn-sm'; aDel.textContent = '✕';
          aDel.style.cssText = 'color:var(--danger);cursor:pointer;flex-shrink:0';
          aDel.addEventListener('click', () => { d.actions.splice(ai,1); this.markDirty(); this.renderEditor(); });
          actInner.appendChild(aDel);
          actRow.appendChild(actInner);

          // Preview line
          const preview = document.createElement('div');
          preview.style.cssText = 'font-size:9px;color:var(--text-muted);padding:1px 4px;margin-top:2px;font-style:italic';
          const actType = d.actions[ai].type || '?';
          const actKey = d.actions[ai].key || '';
          const actVal = d.actions[ai].value !== undefined ? '='+d.actions[ai].value : '';
          preview.textContent = `→ ${actTypeConfig[actType]?.label||actType} ${actKey}${actVal}`;
          actRow.appendChild(preview);

          subContainer.appendChild(actRow);
        }

        const addA = document.createElement('div');
        addA.style.cssText = 'display:flex;align-items:center;gap:4px;margin:3px 0';
        const newActType = document.createElement('select');
        newActType.style.cssText = 'width:100px;padding:2px 4px;background:var(--bg-input);border:1px dashed var(--border);border-radius:var(--radius-sm);color:var(--text-muted);font-size:10px;outline:none';
        newActType.innerHTML = Object.entries(actTypeConfig).slice(0,8).map(([k,v]) =>
          `<option value="${k}">${v.label}</option>`
        ).join('');
        addA.appendChild(newActType);
        const addABtn = document.createElement('button');
        addABtn.style.cssText = 'padding:2px 10px;background:transparent;border:1px dashed var(--border);border-radius:var(--radius-sm);color:var(--text-muted);cursor:pointer;font-size:10px';
        addABtn.textContent = '➕ 动作';
        addABtn.addEventListener('click', () => {
          const t = newActType.value;
          const cfg = actTypeConfig[t];
          const def = { type:t };
          if (cfg.fields.includes('key')) def.key = '';
          if (cfg.fields.includes('value')) def.value = cfg.valDefault !== undefined ? cfg.valDefault : 0;
          if (cfg.fields.includes('message')) def.message = '';
          d.actions.push(def);
          this.markDirty(); this.renderEditor();
        });
        addA.appendChild(addABtn);
        subContainer.appendChild(addA);

        // ── Dialog preview ──
        const prevBtn = document.createElement('button');
        prevBtn.style.cssText = 'display:block;padding:3px 10px;background:transparent;border:1px dashed var(--border);border-radius:var(--radius-sm);color:var(--text-muted);cursor:pointer;font-size:10px;margin:6px 0';
        prevBtn.innerHTML = '👁️ 预览对话';
        prevBtn.addEventListener('click', () => {
          const lines = Array.isArray(d.text) ? d.text : [d.text||''];
          const condStr = Object.keys(d.conditions).length > 0 ?
            '条件: '+Object.entries(d.conditions).map(([k,v]) => `${k}=${v}`).join(', ') : '无条件';
          const actStr = d.actions.length > 0 ?
            '→ '+d.actions.map(a => `${a.type}${a.key?':'+a.key:''}${a.value!==undefined?'='+a.value:''}`).join(' | ') : '无动作';
          let html = '<div style="background:#000;border:1px solid #333;border-radius:8px;padding:12px;max-width:400px">';
          html += '<div style="font-size:10px;color:#888;margin-bottom:6px">🗨️ 对话预览</div>';
          for (const l of lines) {
            if (l) html += `<div style="color:#e6edf3;font-size:13px;padding:2px 0">${escHtml(l)}</div>`;
            else html += '<div style="height:4px"></div>';
          }
          html += `<div style="font-size:9px;color:#58a6ff;margin-top:6px;border-top:1px solid #333;padding-top:4px">${escHtml(condStr)}</div>`;
          html += `<div style="font-size:9px;color:#3fb950">${escHtml(actStr)}</div>`;
          html += '</div>';
          const overlay = document.createElement('div');
          overlay.className = 'dialog-overlay';
          overlay.innerHTML = `<div class="dialog-box" style="width:480px"><div class="dialog-box-header">👁️ 对话预览</div><div class="dialog-box-body">${html}</div><div class="dialog-box-footer"><button class="btn" onclick="this.closest('.dialog-overlay').remove()">关闭</button></div></div>`;
          overlay.addEventListener('click', e => { if(e.target===overlay) overlay.remove(); });
          document.body.appendChild(overlay);
        });
        subContainer.appendChild(prevBtn);

        editor.appendChild(subContainer);
      }
    }

    const addDialog = document.createElement('button');
    addDialog.className = 'add-btn';
    addDialog.innerHTML = '➕ 添加对话节点';
    addDialog.addEventListener('click', () => {
      dialogs.push({ id:'', text:'', conditions:{}, actions:[] });
      this.markDirty();
      this.renderEditor();
    });
    editor.appendChild(addDialog);

    // ── Story Flags Dashboard ──
    const flags = this.collectStoryFlags();
    if (flags.length > 0) {
      const flagSec = document.createElement('div');
      flagSec.style.cssText = 'margin-top:20px;padding-top:12px;border-top:1px solid var(--border)';
      const flagTitle = document.createElement('div');
      flagTitle.className = 'form-section-title';
      flagTitle.innerHTML = `📌 剧情标记总览 <span style="font-size:10px;color:var(--text-muted);font-weight:400">${flags.length} 个标记 · 所有NPC共用</span>`;
      flagSec.appendChild(flagTitle);

      // Build usage map
      const usage = {};
      for (const f of flags) {
        usage[f] = [];
        for (const npc of (this.getRefData('npcs.json') || [])) {
          if (!npc.dialogs) continue;
          for (const d of npc.dialogs) {
            let found = false;
            if (d.conditions && typeof d.conditions === 'object') {
              for (const [ck, cv] of Object.entries(d.conditions)) {
                if ((ck === 'flag' || ck === 'not_flag') && cv === f) found = true;
              }
            }
            if (d.actions) {
              for (const a of d.actions) {
                if (a.type === 'set_flag' && a.key === f) found = true;
              }
            }
            if (found) usage[f].push({ npc: npc.id, step: d.id });
          }
        }
      }

      const flagTable = document.createElement('table');
      flagTable.className = 'array-table';
      let fhtml = '<thead><tr><th style="width:30px">#</th><th>Flag 名称</th><th>使用次数</th><th>使用位置</th></tr></thead><tbody>';
      for (let fi = 0; fi < flags.length; fi++) {
        const f = flags[fi];
        const refs = usage[f] || [];
        const refStr = refs.map(r => `${r.npc}/${r.step}`).join(', ') || '(未使用)';  
        fhtml += `<tr>
          <td style="color:var(--text-muted);font-size:10px">${fi+1}</td>
          <td style="font-family:var(--font-mono);font-size:11px;color:var(--accent)">${escHtml(f)}</td>
          <td style="text-align:center;color:var(--text-secondary)">${refs.length}</td>
          <td style="font-size:10px;color:var(--text-secondary);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${escHtml(refStr)}">${escHtml(refStr)}</td>
        </tr>`;
      }
      fhtml += '</tbody>';
      flagTable.innerHTML = fhtml;
      flagSec.appendChild(flagTable);

      // Note
      const note = document.createElement('div');
      note.style.cssText = 'font-size:10px;color:var(--text-muted);margin-top:6px;padding:6px 8px;background:var(--bg-tertiary);border-radius:var(--radius-sm)';
      note.innerHTML = '💡 Flag 命名建议：用 <code>snake_case</code>，例如 <code>met_flower</code>、<code>has_pistol</code>。新增 flag 直接在条件/动作里输入新名字即可，会自动收集到这里。';
      flagSec.appendChild(note);

      editor.appendChild(flagSec);
    }

    container.appendChild(editor);
  }

  // ====== 图形流程图视图 ======
  renderGraphView(entry, container, dialogs) {
    const gv = document.createElement('div');
    gv.className = 'graph-view-container';

    // ── Render nodes ──
    const renderNodes = () => {
      gv.innerHTML = '';

      // Collapse all edit panels first
      for (let i = 0; i < dialogs.length; i++) {
        const ek = '_graph_expand_' + i;
        if (this[ek] === undefined) this[ek] = false;
      }

      for (let i = 0; i < dialogs.length; i++) {
        const d = dialogs[i];
        const isExpanded = this['_graph_expand_' + i];

        const wrapper = document.createElement('div');
        wrapper.className = 'graph-node-wrapper';
        const hint = document.createElement('div');
        hint.className = 'graph-drag-hint';
        hint.textContent = '⋮ 拖拽排序';
        wrapper.appendChild(hint);
        wrapper.dataset.idx = i;
        wrapper.draggable = true;
        let dragIdx = -1;
        wrapper.addEventListener('dragstart', (e) => {
          dragIdx = i;
          e.dataTransfer.effectAllowed = 'move';
          e.dataTransfer.setData('text/plain', String(i));
          wrapper.style.opacity = '0.4';
        });
        wrapper.addEventListener('dragend', () => {
          wrapper.style.opacity = '1';
          gv.querySelectorAll('.graph-node-wrapper').forEach(w => w.classList.remove('drag-over'));
        });
        wrapper.addEventListener('dragover', (e) => {
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
          gv.querySelectorAll('.graph-node-wrapper').forEach(w => w.classList.remove('drag-over'));
          wrapper.classList.add('drag-over');
        });
        wrapper.addEventListener('drop', (e) => {
          e.preventDefault();
          const fromIdx = parseInt(e.dataTransfer.getData('text/plain'));
          const toIdx = i;
          if (fromIdx !== toIdx && fromIdx >= 0 && fromIdx < dialogs.length && toIdx >= 0 && toIdx < dialogs.length) {
            const item = dialogs.splice(fromIdx, 1)[0];
            dialogs.splice(toIdx, 0, item);
            this.markDirty();
            this['_graph_expand_' + toIdx] = this['_graph_expand_' + fromIdx] || false;
            renderNodes();
          }
        });

        // ── Card ──
        const card = document.createElement('div');
        card.className = 'graph-node-card';

        // Header
        const header = document.createElement('div');
        header.className = 'graph-node-header';
        const badge = document.createElement('span');
        badge.className = 'graph-node-badge';
        badge.textContent = '#' + (i + 1);
        header.appendChild(badge);
        const idSpan = document.createElement('span');
        idSpan.className = 'graph-node-id';
        idSpan.textContent = d.id || '(无ID)';
        header.appendChild(idSpan);
        // Expand toggle
        const expandBtn = document.createElement('button');
        expandBtn.style.cssText = 'font-size:10px;padding:1px 6px;background:transparent;border:1px solid var(--border);border-radius:3px;color:var(--text-muted);cursor:pointer;font-size:10px';
        expandBtn.textContent = isExpanded ? '🔼' : '✏️';
        expandBtn.title = isExpanded ? '折叠' : '编辑';
        expandBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          this['_graph_expand_' + i] = !this['_graph_expand_' + i];
          renderNodes();
          this['_graph_scroll'] = wrapper.offsetTop;
        });
        header.appendChild(expandBtn);
        // Copy (clone)
        const copyBtn = document.createElement('button');
        copyBtn.style.cssText = 'color:var(--text-muted);cursor:pointer;font-size:11px;padding:2px 4px;border:none;background:none;opacity:.5;transition:opacity .15s';
        copyBtn.textContent = '📋';
        copyBtn.title = '复制此步骤';
        copyBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          const clone = JSON.parse(JSON.stringify(d));
          dialogs.splice(i + 1, 0, clone);
          this.markDirty();
          this['_graph_expand_' + (i + 1)] = true;
          renderNodes();
        });
        header.appendChild(copyBtn);
        // Delete
        const delBtn = document.createElement('button');
        delBtn.className = 'graph-node-del';
        delBtn.textContent = '✕';
        delBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          dialogs.splice(i, 1);
          this.markDirty();
          renderNodes();
        });
        header.appendChild(delBtn);
        card.appendChild(header);

        // Text preview
        const textEl = document.createElement('div');
        textEl.className = 'graph-node-text';
        const lines = Array.isArray(d.text) ? d.text : [d.text || ''];
        textEl.textContent = lines.filter(l => l).join(' | ').slice(0, 80);
        card.appendChild(textEl);

        // Tags (conditions + actions)
        const tags = document.createElement('div');
        tags.className = 'graph-node-tags';
        if (d.conditions) {
          for (const [ck, cv] of Object.entries(d.conditions)) {
            const t = document.createElement('span');
            t.className = 'graph-tag graph-tag-cond';
            const icon = ck === 'flag' ? '🔸' : ck === 'not_flag' ? '🔹' : ck === 'level_ge' ? '📊' : ck === 'reputation_ge' ? '⭐' : ck === 'gold_ge' ? '💰' : '🏷️';
            t.textContent = icon + ' ' + cv;
            tags.appendChild(t);
          }
        }
        if (d.actions) {
          for (const a of d.actions) {
            const t = document.createElement('span');
            t.className = 'graph-tag graph-tag-action';
            const desc = a.type === 'set_flag' ? '⚡' + (a.key || '') : a.type === 'open_skills' ? '📖技能' : a.type === 'open_shop' ? '🏪商店' : a.type === 'open_craft' ? '🔧打造' : a.type === 'add_reputation' ? '⭐声望' : '⚡' + a.type;
            t.textContent = desc;
            tags.appendChild(t);
          }
        }
        card.appendChild(tags);

        // Click to expand edit
        card.addEventListener('click', (e) => {
          if (e.target.closest('.graph-node-del') || e.target.closest('button')) return;
          this['_graph_expand_' + i] = !this['_graph_expand_' + i];
          renderNodes();
        });
        wrapper.appendChild(card);

        // ── Inline edit panel (expanded) ──
        if (isExpanded) {
          const editPanel = document.createElement('div');
          editPanel.className = 'graph-node-expanded';

          // ID field
          const idRow = document.createElement('div');
          idRow.style.cssText = 'display:flex;align-items:center;gap:4px;padding:2px 0';
          const idLabel = document.createElement('span');
          idLabel.style.cssText = 'font-size:9px;color:var(--text-muted);min-width:20px';
          idLabel.textContent = 'ID';
          idRow.appendChild(idLabel);
          const idInput = document.createElement('input');
          idInput.type = 'text'; idInput.value = d.id || '';
          idInput.placeholder = '步骤标识...';
          idInput.style.cssText = 'flex:1;padding:2px 5px;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-primary);font-size:10px;outline:none';
          idInput.addEventListener('input', () => { d.id = idInput.value; this.markDirty(); });
          idRow.appendChild(idInput);
          editPanel.appendChild(idRow);

          // text_key auto-generate
          const tkRow = document.createElement('div');
          tkRow.style.cssText = 'display:flex;align-items:center;gap:4px;padding:1px 0;margin-top:2px';
          const tkLabel = document.createElement('span');
          tkLabel.style.cssText = 'font-size:8px;color:var(--text-muted);min-width:20px';
          tkLabel.textContent = 'key';
          tkRow.appendChild(tkLabel);
          const tkInp = document.createElement('input');
          tkInp.type = 'text'; tkInp.value = d.text_key || '';
          tkInp.placeholder = 'text_key (可选)';
          tkInp.style.cssText = 'flex:1;padding:1px 4px;background:var(--bg-input);border:1px solid var(--border);border-radius:3px;color:var(--text-primary);font-size:9px;outline:none';
          tkInp.addEventListener('input', () => { d.text_key = tkInp.value; this.markDirty(); });
          tkRow.appendChild(tkInp);
          const genKeyBtn = document.createElement('button');
          genKeyBtn.textContent = '🔄 自动生成';
          genKeyBtn.style.cssText = 'font-size:8px;padding:1px 6px;background:transparent;border:1px dashed var(--border);border-radius:3px;color:var(--text-muted);cursor:pointer;white-space:nowrap';
          genKeyBtn.title = '根据NPC ID和步骤ID生成：npc.{npc_id}.{step_id}.{line}';
          genKeyBtn.addEventListener('click', () => {
            const npcId = entry.id || 'npc';
            const stepId = d.id || 'step' + i;
            const gen = 'npc.' + npcId + '.' + stepId;
            d.text_key = gen;
            tkInp.value = gen;
            this.markDirty();
          });
          tkRow.appendChild(genKeyBtn);
          editPanel.appendChild(tkRow);

          // Text lines
          const textLines = Array.isArray(d.text) ? d.text : [d.text || ''];
          const textLabel = document.createElement('div');
          textLabel.style.cssText = 'font-size:9px;color:var(--text-muted);padding:2px 0;margin-top:4px';
          textLabel.textContent = '📝 文本';
          editPanel.appendChild(textLabel);
          for (let ti = 0; ti < textLines.length; ti++) {
            const tRow = document.createElement('div');
            tRow.style.cssText = 'display:flex;align-items:center;gap:4px;padding:1px 0';
            const tInp = document.createElement('input');
            tInp.type = 'text'; tInp.value = textLines[ti];
            tInp.placeholder = '对话行...';
            tInp.style.cssText = 'flex:1;padding:2px 5px;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-primary);font-size:10px;outline:none';
            tInp.addEventListener('input', () => {
              textLines[ti] = tInp.value;
              d.text = textLines.length === 1 ? textLines[0] : textLines;
              this.markDirty();
            });
            tRow.appendChild(tInp);
            const tDel = document.createElement('button');
            tDel.textContent = '✕';
            tDel.style.cssText = 'color:var(--danger);cursor:pointer;font-size:9px;border:none;background:none;padding:0 2px';
            tDel.addEventListener('click', () => {
              textLines.splice(ti, 1);
              d.text = textLines.length === 0 ? '' : (textLines.length === 1 ? textLines[0] : textLines);
              this.markDirty();
              renderNodes();
            });
            tRow.appendChild(tDel);
            editPanel.appendChild(tRow);
          }
          const addTextBtn = document.createElement('button');
          addTextBtn.style.cssText = 'font-size:9px;padding:1px 8px;background:transparent;border:1px dashed var(--border);border-radius:3px;color:var(--text-muted);cursor:pointer;margin:1px 0';
          addTextBtn.textContent = '+ 行';
          addTextBtn.addEventListener('click', () => {
            textLines.push('');
            d.text = textLines.length === 1 ? textLines[0] : textLines;
            this.markDirty();
            renderNodes();
          });
          editPanel.appendChild(addTextBtn);

          // ── Reuse existing condition/action editor helpers ──
          // Conditions: simple key-value with dropdown
          const condLabel2 = document.createElement('div');
          condLabel2.style.cssText = 'font-size:9px;color:var(--orange);padding:4px 0 1px;margin-top:4px;font-weight:600';
          condLabel2.textContent = '🚩 条件';
          editPanel.appendChild(condLabel2);

          if (!d.conditions || typeof d.conditions !== 'object') d.conditions = {};
          for (const [ck, cv] of Object.entries(d.conditions)) {
            const cRow = document.createElement('div');
            cRow.style.cssText = 'display:flex;align-items:center;gap:3px;padding:1px 0';
            const cSel = document.createElement('select');
            cSel.style.cssText = 'width:80px;padding:1px 3px;background:var(--bg-input);border:1px solid var(--border);border-radius:3px;color:var(--text-primary);font-size:9px;outline:none';
            const condTypes = ['flag','not_flag','level_ge','reputation_ge','gold_ge','has_item','chance'];
            cSel.innerHTML = condTypes.map(t => `<option value="${t}" ${ck===t?'selected':''}>${t}</option>`).join('');
            cSel.addEventListener('change', () => {
              const oldV = d.conditions[ck];
              delete d.conditions[ck];
              d.conditions[cSel.value] = oldV;
              this.markDirty();
              renderNodes();
            });
            cRow.appendChild(cSel);
            const cInp = document.createElement('input');
            cInp.type = 'text'; cInp.value = String(cv ?? '');
            cInp.placeholder = '值';
            cInp.style.cssText = 'flex:1;padding:1px 4px;background:var(--bg-input);border:1px solid var(--border);border-radius:3px;color:var(--text-primary);font-size:9px;outline:none';
            cInp.addEventListener('input', () => { d.conditions[cSel.value] = cInp.value; this.markDirty(); });
            cRow.appendChild(cInp);
            const cDel = document.createElement('button');
            cDel.textContent = '✕';
            cDel.style.cssText = 'color:var(--danger);cursor:pointer;font-size:8px;border:none;background:none;padding:0 2px';
            cDel.addEventListener('click', () => {
              delete d.conditions[ck];
              this.markDirty();
              renderNodes();
            });
            cRow.appendChild(cDel);
            editPanel.appendChild(cRow);
          }
          const addCondBtn = document.createElement('button');
          addCondBtn.style.cssText = 'font-size:9px;padding:1px 8px;background:transparent;border:1px dashed var(--border);border-radius:3px;color:var(--text-muted);cursor:pointer;margin:1px 0';
          addCondBtn.textContent = '+ 条件';
          addCondBtn.addEventListener('click', () => {
            d.conditions['flag'] = '';
            this.markDirty();
            renderNodes();
          });
          editPanel.appendChild(addCondBtn);

          // Actions: type dropdown + key + value
          const actLabel2 = document.createElement('div');
          actLabel2.style.cssText = 'font-size:9px;color:var(--cyan);padding:4px 0 1px;margin-top:4px;font-weight:600';
          actLabel2.textContent = '⚡ 动作';
          editPanel.appendChild(actLabel2);

          const actTypes = ['set_flag','add_reputation','add_gold','heal','message','open_shop','open_skills','open_craft','teleport','add_item','remove_item','complete_quest','start_quest'];
          // Reference data for pickers
          const items = (this.getRefData('mmo/mmo_items.json') || []).map(x => ({ id:x.id||x.item_id, label:(x.name||x.id||'?').slice(0,24) }));
          const quests = (this.getRefData('quests.json') || []).map(x => ({ id:x.id, label:(x.name||x.id||'?').slice(0,24) }));
          const worlds = (this.getRefData('worlds.json') || []).map(x => ({ id:x.id, label:(x.name||'W'+x.id).slice(0,24) }));
          const allFlags = this.collectStoryFlags();
          function refPicker(refs, placeholder) {
            const s = document.createElement('select');
            s.style.cssText = 'max-width:60px;padding:1px 3px;background:var(--bg-tertiary);border:1px solid var(--border);border-radius:3px;color:var(--text-muted);font-size:8px;outline:none;flex-shrink:0';
            let h = '<option value="">'+placeholder+'</option>';
            for (const r of refs) h += '<option value="'+r.id+'">'+escHtml(r.label)+'</option>';
            s.innerHTML = h;
            return s;
          }
          for (let ai = 0; ai < d.actions.length; ai++) {
            const aRow = document.createElement('div');
            aRow.style.cssText = 'display:flex;align-items:center;gap:3px;padding:1px 0';
            // Type select
            const aSel = document.createElement('select');
            aSel.style.cssText = 'width:80px;padding:1px 3px;background:var(--bg-input);border:1px solid var(--border);border-radius:3px;color:var(--text-primary);font-size:9px;outline:none;flex-shrink:0';
            aSel.innerHTML = actTypes.map(t => `<option value="${t}" ${d.actions[ai].type===t?'selected':''}>${t}</option>`).join('');
            aSel.addEventListener('change', () => { d.actions[ai].type = aSel.value; this.markDirty(); renderNodes(); });
            aRow.appendChild(aSel);
            // Key input + reference picker (context-aware)
            const at = d.actions[ai].type;
            const needsKey = ['set_flag','add_item','remove_item','complete_quest','start_quest','teleport','open_shop','message'].includes(at);
            if (needsKey) {
              const aKey = document.createElement('input');
              aKey.type = 'text'; aKey.value = d.actions[ai].key || '';
              aKey.placeholder = at==='set_flag'?'flag名':at.includes('item')?'物品ID':at.includes('quest')?'任务ID':at==='teleport'?'地图名':at==='open_shop'?'商店ID':'key';
              aKey.style.cssText = 'width:60px;padding:1px 4px;background:var(--bg-input);border:1px solid var(--border);border-radius:3px;color:var(--text-primary);font-size:9px;outline:none';
              aKey.addEventListener('input', () => { d.actions[ai].key = aKey.value; this.markDirty(); });
              aRow.appendChild(aKey);
              // Reference picker
              let refs = null;
              let pickerPlaceholder = '选...';
              if (at === 'set_flag') { refs = allFlags.map(f=>({id:f,label:f})); pickerPlaceholder = '选flag'; }
              else if (at === 'add_item' || at === 'remove_item') { refs = items; pickerPlaceholder = '选物品'; }
              else if (at === 'complete_quest' || at === 'start_quest') { refs = quests; pickerPlaceholder = '选任务'; }
              else if (at === 'teleport') { refs = worlds; pickerPlaceholder = '选地图'; }
              if (refs && refs.length > 0) {
                const picker = refPicker(refs, pickerPlaceholder);
                picker.addEventListener('change', () => {
                  if (picker.value) { d.actions[ai].key = picker.value; aKey.value = picker.value; this.markDirty(); renderNodes(); }
                });
                aRow.appendChild(picker);
              }
            }
            // Value input
            const needsVal = ['set_flag','add_reputation','add_gold','remove_gold','heal','add_item','remove_item','set_level'].includes(at);
            if (needsVal) {
              const aVal = document.createElement('input');
              aVal.type = 'text'; aVal.value = String(d.actions[ai].value ?? '');
              aVal.placeholder = 'val';
              aVal.style.cssText = 'width:35px;padding:1px 4px;background:var(--bg-input);border:1px solid var(--border);border-radius:3px;color:var(--text-primary);font-size:9px;outline:none';
              aVal.addEventListener('input', () => { d.actions[ai].value = isNaN(Number(aVal.value)) ? aVal.value : Number(aVal.value); this.markDirty(); });
              aRow.appendChild(aVal);
            }
            // Delete
            const aDel = document.createElement('button');
            aDel.textContent = '✕';
            aDel.style.cssText = 'color:var(--danger);cursor:pointer;font-size:8px;border:none;background:none;padding:0 2px;flex-shrink:0';
            aDel.addEventListener('click', () => {
              d.actions.splice(ai, 1);
              this.markDirty();
              renderNodes();
            });
            aRow.appendChild(aDel);
            editPanel.appendChild(aRow);
          }
          const addActBtn = document.createElement('button');
          addActBtn.style.cssText = 'font-size:9px;padding:1px 8px;background:transparent;border:1px dashed var(--border);border-radius:3px;color:var(--text-muted);cursor:pointer;margin:1px 0';
          addActBtn.textContent = '+ 动作';
          addActBtn.addEventListener('click', () => {
            d.actions.push({ type:'set_flag', key:'', value:1 });
            this.markDirty();
            renderNodes();
          });
          editPanel.appendChild(addActBtn);

          wrapper.appendChild(editPanel);
        }

        // ── Add-step button (in-between) ──
        const addInBtn = document.createElement('div');
        addInBtn.className = 'graph-node-add-inset';
        const addB = document.createElement('button');
        addB.textContent = '➕ 插入步骤';
        addB.addEventListener('click', () => {
          dialogs.splice(i + 1, 0, { id:'', text:'', conditions:{}, actions:[] });
          this.markDirty();
          this['_graph_expand_' + (i + 1)] = true;
          renderNodes();
        });
        addInBtn.appendChild(addB);

        gv.appendChild(wrapper);
        gv.appendChild(addInBtn);

        // ── SVG connector (rendered after all nodes) ──
        // Will be drawn after all nodes are placed
      }

      // Add final add-dialog button
      const finalAdd = document.createElement('div');
      finalAdd.style.cssText = 'text-align:center;padding:4px 0';
      const faBtn = document.createElement('button');
      faBtn.className = 'add-btn';
      faBtn.innerHTML = '➕ 添加对话节点(末尾)';
      faBtn.addEventListener('click', () => {
        dialogs.push({ id:'', text:'', conditions:{}, actions:[] });
        this.markDirty();
        renderNodes();
      });
      finalAdd.appendChild(faBtn);
      gv.appendChild(finalAdd);

      // ── Draw SVG connectors ──
      requestAnimationFrame(() => {
        const svg = document.querySelector('.graph-view-container svg.connector-lines') || null;
        if (!svg) {
          const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
          s.setAttribute('class', 'connector-lines');
          gv.insertBefore(s, gv.firstChild);
        }
        // Calculate connector lines between adjacent wrappers
        const wrappers = gv.querySelectorAll('.graph-node-wrapper');
        const svgEl = gv.querySelector('svg.connector-lines');
        if (!svgEl || wrappers.length < 2) return;
        const gvRect = gv.getBoundingClientRect();
        svgEl.setAttribute('viewBox', '0 0 ' + gvRect.width + ' ' + gvRect.height);
        svgEl.innerHTML = '';
        for (let wi = 0; wi < wrappers.length - 1; wi++) {
          const topEl = wrappers[wi].querySelector('.graph-node-card');
          const botEl = wrappers[wi + 1].querySelector('.graph-node-card');
          if (!topEl || !botEl) continue;
          const topR = topEl.getBoundingClientRect();
          const botR = botEl.getBoundingClientRect();
          const x1 = topR.left - gvRect.left + topR.width / 2;
          const y1 = topR.bottom - gvRect.top;
          const x2 = botR.left - gvRect.left + botR.width / 2;
          const y2 = botR.top - gvRect.top;
          const midY = (y1 + y2) / 2;
          const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          const d = `M ${x1} ${y1} C ${x1} ${midY}, ${x2} ${midY}, ${x2} ${y2}`;
          path.setAttribute('d', d);
          path.setAttribute('stroke', 'var(--border)');
          path.setAttribute('stroke-width', '1.5');
          path.setAttribute('stroke-dasharray', '5,4');
          path.setAttribute('fill', 'none');
          svgEl.appendChild(path);
          // Arrow head at the end
          const marker = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
          const arrowSize = 6;
          marker.setAttribute('points', `0,0 -${arrowSize},-${arrowSize/2} -${arrowSize},${arrowSize/2}`);
          marker.setAttribute('fill', 'var(--border)');
          // Position at end of curve
          const angle = Math.atan2(y2 - midY, x2 - x1);
          marker.setAttribute('transform', `translate(${x2},${y2}) rotate(${angle * 180 / Math.PI})`);
          svgEl.appendChild(marker);
        }
      });
    };

    renderNodes();
    container.appendChild(gv);
  }

  // ====== 全局故事线地图 ======
  renderStoryMap(entry, container, dialogs) {
    const allNpcs = this.getRefData('npcs.json') || [];

    // Collect all flag connections across ALL NPCs
    const flagOrigins = {}; // flag -> npc_id that SETs it
    const flagTargets = {}; // flag -> npc_ids that CHECK it
    const npcNodes = {};    // npc_id -> {sets:[], checks:[]}

    for (const npc of allNpcs) {
      const id = npc.id || '?';
      npcNodes[id] = { sets: new Set(), checks: new Set() };
      if (!npc.dialogs) continue;
      for (const d of npc.dialogs) {
        // Check actions for set_flag
        if (d.actions) {
          for (const a of d.actions) {
            if (a.type === 'set_flag' && a.key) {
              npcNodes[id].sets.add(a.key);
              if (!flagOrigins[a.key]) flagOrigins[a.key] = [];
              if (!flagOrigins[a.key].includes(id)) flagOrigins[a.key].push(id);
            }
          }
        }
        // Check conditions for flag/not_flag
        if (d.conditions && typeof d.conditions === 'object') {
          for (const [ck, cv] of Object.entries(d.conditions)) {
            if ((ck === 'flag' || ck === 'not_flag') && cv) {
              npcNodes[id].checks.add(cv);
              if (!flagTargets[cv]) flagTargets[cv] = [];
              if (!flagTargets[cv].includes(id)) flagTargets[cv].push(id);
            }
          }
        }
      }
    }

    const storyMap = document.createElement('div');
    storyMap.style.cssText = 'padding:8px 0';

    // Title
    const header = document.createElement('div');
    header.style.cssText = 'font-size:12px;font-weight:600;color:var(--text-primary);margin-bottom:12px';
    header.innerHTML = `🌐 全局故事线 · 标记流动`;
    storyMap.appendChild(header);

    // Flow section: for each flag, show who sets it and who checks it
    const allFlags = new Set([...Object.keys(flagOrigins), ...Object.keys(flagTargets)]);
    if (allFlags.size === 0) {
      const empty = document.createElement('div');
      empty.style.cssText = 'color:var(--text-muted);padding:20px;text-align:center;font-size:12px';
      empty.textContent = '还没有剧情标记，先创建一些对话吧';
      storyMap.appendChild(empty);
      container.appendChild(storyMap);
      return;
    }

    // ── Flow cards ──
    for (const flag of [...allFlags].sort()) {
      const fromNpcs = flagOrigins[flag] || [];
      const toNpcs = flagTargets[flag] || [];

      const card = document.createElement('div');
      card.style.cssText = 'background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:8px 12px;margin-bottom:6px';

      // Flag name
      const fName = document.createElement('div');
      fName.style.cssText = 'font-family:var(--font-mono);font-size:12px;font-weight:600;color:var(--accent);margin-bottom:4px';
      fName.textContent = '🚩 ' + flag;
      card.appendChild(fName);

      // Flow arrow
      const flow = document.createElement('div');
      flow.style.cssText = 'display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11px;padding:4px 0';

      // Sources
      const srcDiv = document.createElement('div');
      srcDiv.style.cssText = 'display:flex;align-items:center;gap:4px;flex-wrap:wrap';
      srcDiv.innerHTML = '<span style="color:var(--text-muted);font-size:10px">设置:</span>';
      if (fromNpcs.length === 0) {
        const none = document.createElement('span');
        none.style.cssText = 'color:var(--warning);font-size:10px;font-style:italic';
        none.textContent = '(尚无NPC设置)';
        srcDiv.appendChild(none);
      } else {
        for (const nid of fromNpcs) {
          const tag = document.createElement('span');
          tag.style.cssText = 'padding:1px 8px;background:rgba(63,185,80,.15);color:var(--success);border-radius:3px;font-size:10px;cursor:pointer';
          tag.textContent = nid;
          tag.title = '点此浏览该NPC';
          tag.addEventListener('click', () => {
            // Switch to this NPC
            const idx = allNpcs.findIndex(n => n.id === nid);
            if (idx >= 0) {
              this.currentEntryIdx = idx;
              this['_show_story_map_'] = false;
              this.renderSidebar();
              this.renderEditor();
            }
          });
          srcDiv.appendChild(tag);
        }
      }
      flow.appendChild(srcDiv);

      // Arrow
      const arrow = document.createElement('span');
      arrow.style.cssText = 'color:var(--text-muted);font-size:14px';
      arrow.textContent = '→';
      flow.appendChild(arrow);

      // Targets
      const tgtDiv = document.createElement('div');
      tgtDiv.style.cssText = 'display:flex;align-items:center;gap:4px;flex-wrap:wrap';
      tgtDiv.innerHTML = '<span style="color:var(--text-muted);font-size:10px">检查:</span>';
      if (toNpcs.length === 0) {
        const none = document.createElement('span');
        none.style.cssText = 'color:var(--text-muted);font-size:10px;font-style:italic';
        none.textContent = '(尚无NPC使用)';
        tgtDiv.appendChild(none);
      } else {
        for (const nid of toNpcs) {
          const tag = document.createElement('span');
          tag.style.cssText = 'padding:1px 8px;background:rgba(57,210,192,.15);color:var(--cyan);border-radius:3px;font-size:10px;cursor:pointer';
          tag.textContent = nid;
          tag.title = '点此浏览该NPC';
          tag.addEventListener('click', () => {
            const idx = allNpcs.findIndex(n => n.id === nid);
            if (idx >= 0) {
              this.currentEntryIdx = idx;
              this['_show_story_map_'] = false;
              this.renderSidebar();
              this.renderEditor();
            }
          });
          tgtDiv.appendChild(tag);
        }
      }
      flow.appendChild(tgtDiv);

      card.appendChild(flow);

      // NPC summary for this flag
      const summary = document.createElement('div');
      summary.style.cssText = 'font-size:9px;color:var(--text-muted);margin-top:4px;padding-top:4px;border-top:1px solid var(--border)';
      const fromDialogs = [];
      const toDialogs = [];
      if (npcNodes) {
        for (const [nid, info] of Object.entries(npcNodes)) {
          if (info.sets.has(flag)) fromDialogs.push(nid);
          if (info.checks.has(flag)) toDialogs.push(nid);
        }
      }
      summary.textContent = `${fromDialogs.length} 个NPC设置 · ${toDialogs.length} 个NPC检查`;
      card.appendChild(summary);

      storyMap.appendChild(card);
    }

    // ── NPC role summary ──
    const npcSection = document.createElement('div');
    npcSection.style.cssText = 'margin-top:20px;padding-top:12px;border-top:1px solid var(--border)';
    const npcTitle = document.createElement('div');
    npcTitle.className = 'form-section-title';
    npcTitle.innerHTML = `👤 NPC 剧情角色总览`;
    npcSection.appendChild(npcTitle);

    const npcTable = document.createElement('table');
    npcTable.className = 'array-table';
    let nhtml = '<thead><tr><th>NPC</th><th>设置标记</th><th>检查标记</th></tr></thead><tbody>';
    for (const [nid, info] of Object.entries(npcNodes)) {
      const sets = [...info.sets].join(', ') || '-';
      const checks = [...info.checks].join(', ') || '-';
      nhtml += `<tr>
        <td style="font-family:var(--font-mono);color:var(--accent);font-size:11px">${escHtml(nid)}</td>
        <td style="font-size:10px;color:var(--success)">${escHtml(sets)}</td>
        <td style="font-size:10px;color:var(--cyan)">${escHtml(checks)}</td>
      </tr>`;
    }
    nhtml += '</tbody>';
    npcTable.innerHTML = nhtml;
    npcSection.appendChild(npcTable);

    storyMap.appendChild(npcSection);

    // Guide text
    const guide = document.createElement('div');
    guide.style.cssText = 'font-size:10px;color:var(--text-muted);margin-top:8px;padding:6px 8px;background:var(--bg-tertiary);border-radius:var(--radius-sm)';
    guide.innerHTML = '💡 点NPC名可直接跳转编辑。每个🚩代表一个故事标记，箭头表示<strong>谁设置 → 谁检查</strong>。';
    storyMap.appendChild(guide);

    container.appendChild(storyMap);
  }

  getCurrentEntry() {
    const arr = this.getEntryArray(this.currentFile);
    if (!arr || this.currentEntryIdx < 0 || this.currentEntryIdx >= arr.length) return null;
    return arr[this.currentEntryIdx];
  }

  // ====== 验证 ======
  validate() {
    this.validationErrors = [];
    for (const fn of this.fileNames) {
      const file = this.files.get(fn);
      if (!file || !file.data) continue;

      if (SINGLE_OBJECT_FILES.has(fn)) {
        if (fn === 'mmo/world_boss.json') this.validateWorldBoss(file.data);
        continue;
      }

      const arr = this.getEntryArray(fn);
      if (!arr) continue;

      // 检查 ID 重复
      const ids = {};
      for (let i = 0; i < arr.length; i++) {
        const id = String(this.getEntryId(arr[i]));
        if (id in ids) {
          this.validationErrors.push({ type:'warning', file:fn, msg:`ID 重复: "${id}" (条目 #${ids[id]+1} 和 #${i+1})` });
        } else if (id && id !== 'undefined') {
          ids[id] = i;
        }
      }

      // 文件特定验证
      if (fn === 'npcs.json') this.validateNPCs(arr);
      if (fn === 'spawns.json') this.validateSpawns(arr);
      if (fn === 'portals.json') this.validatePortals(arr);
      if (fn === 'scenarios.json') this.validateScenarios(arr);
      if (fn === 'shop_items.json') this.validateShops(arr);
      if (fn === 'mmo/mmo_mobs.json') this.validateMobs(arr);
      if (fn === 'mmo/mmo_items.json') this.validateItems(arr);
      if (fn === 'craft_recipes.json') this.validateRecipes(arr);
    }
    this.renderValidation();
    this.updateStatus();
    const errCount = this.validationErrors.filter(e => e.type === 'error').length;
    toast(`验证完成: ${this.validationErrors.length} 个问题 (${errCount} 错误)`, errCount > 0 ? 'warning' : 'success');
  }

  validateNPCs(arr) {
    // Collect all flags for dependency analysis
    const allSets = {}; // flag -> [{npc,step}]
    const allChecks = {}; // flag -> [{npc,step}]
    // Track per-step condition conflicts

    for (let i = 0; i < arr.length; i++) {
      const n = arr[i];
      if (!n.id) this.validationErrors.push({ type:'error', file:'npcs.json', msg:`#${i+1}: 缺少 id` });
      if (!n.name_key) this.validationErrors.push({ type:'warning', file:'npcs.json', msg:`#${i+1} "${n.id}": 缺少 name_key` });
      if (n.skin === undefined) this.validationErrors.push({ type:'warning', file:'npcs.json', msg:`#${i+1} "${n.id}": 缺少 skin` });

      // Dialog analysis
      if (!n.dialogs) continue;
      for (let di = 0; di < n.dialogs.length; di++) {
        const d = n.dialogs[di];
        if (!d.id) this.validationErrors.push({ type:'warning', file:'npcs.json', msg:`"${n.id}" 对话 #${di+1}: 缺少 step id` });

        // ── Condition conflict detection ──
        if (d.conditions && typeof d.conditions === 'object') {
          const condFlags = Object.entries(d.conditions).filter(([k]) => k === 'flag' || k === 'not_flag');
          const hasFlag = condFlags.some(([k]) => k === 'flag');
          const hasNotFlag = condFlags.some(([k]) => k === 'not_flag');
          // Check flag+not_flag on same key
          if (hasFlag && hasNotFlag) {
            const flagVals = condFlags.filter(([k]) => k === 'flag').map(([,v]) => v);
            const notFlagVals = condFlags.filter(([k]) => k === 'not_flag').map(([,v]) => v);
            for (const fv of flagVals) {
              if (notFlagVals.includes(fv)) {
                this.validationErrors.push({ type:'error', file:'npcs.json',
                  msg:`"${n.id}/${d.id}": 条件冲突! 同时要求 "flag=${fv}" 和 "not_flag=${fv}"` });
              }
            }
          }

          // Collect flag checks
          for (const [ck, cv] of condFlags) {
            if (cv) {
              if (!allChecks[cv]) allChecks[cv] = [];
              allChecks[cv].push({ npc:n.id, step:d.id });
            }
          }

          // Check for impossible conditions
          if (d.conditions.level_ge && d.conditions.level_eq && d.conditions.level_ge > d.conditions.level_eq) {
            this.validationErrors.push({ type:'warning', file:'npcs.json',
              msg:`"${n.id}/${d.id}": 条件矛盾 level≥${d.conditions.level_ge} 且 level=${d.conditions.level_eq}` });
          }
        }

        // Collect flag sets
        if (d.actions) {
          for (const a of d.actions) {
            if (a.type === 'set_flag' && a.key) {
              if (!allSets[a.key]) allSets[a.key] = [];
              allSets[a.key].push({ npc:n.id, step:d.id });
            }
          }
        }
      }
    }

    // ── Orphan flag detection ──
    for (const flag of Object.keys(allSets)) {
      if (!allChecks[flag] || allChecks[flag].length === 0) {
        const setRefs = allSets[flag].map(r => `${r.npc}/${r.step}`).join(', ');
        this.validationErrors.push({ type:'info', file:'npcs.json',
          msg:`🚩 "${flag}" 被设置但没有任何对话检查它 (设置位置: ${setRefs})` });
      }
    }
    for (const flag of Object.keys(allChecks)) {
      if (!allSets[flag] || allSets[flag].length === 0) {
        const checkRefs = allChecks[flag].map(r => `${r.npc}/${r.step}`).join(', ');
        this.validationErrors.push({ type:'warning', file:'npcs.json',
          msg:`🚩 "${flag}" 被检查但没有任何对话设置它 (检查位置: ${checkRefs})` });
      }
    }

    // ── Circular dependency detection (simple: A→B→A within same NPC) ──
    for (let i = 0; i < arr.length; i++) {
      const n = arr[i];
      if (!n.dialogs) continue;
      for (let di = 0; di < n.dialogs.length; di++) {
        const d = n.dialogs[di];
        if (!d.actions || !d.conditions) continue;
        // Check: step sets flag X, and same NPC has condition checking flag X
        const sets = d.actions.filter(a => a.type === 'set_flag' && a.key).map(a => a.key);
        const checks = d.conditions.flag ? [d.conditions.flag] : [];
        if (d.conditions.not_flag) checks.push(...(Array.isArray(d.conditions.not_flag) ? d.conditions.not_flag : [d.conditions.not_flag]));
        for (const set of sets) {
          for (const check of checks) {
            if (set === check && d.conditions.not_flag === set) {
              // Same NPC sets+checks same flag — this is fine, but check if causes loop
              // Look for another step that would re-trigger
              for (let dj = 0; dj < n.dialogs.length; dj++) {
                if (dj === di) continue;
                const d2 = n.dialogs[dj];
                if (d2.conditions && (d2.conditions.flag === set || d2.conditions.not_flag === set)) {
                  // Another step reacts to this flag — could be a cycle
                  const setActs = d.actions.filter(a => a.type === 'set_flag' && a.key === set);
                  for (const sa of setActs) {
                    if (sa.value === undefined || sa.value > 0) {
                      this.validationErrors.push({ type:'info', file:'npcs.json',
                        msg:`⚠️ "${n.id}": "${d.id}" 设 ${set} → "${d2.id}" 检查 ${set} → 可能需要确保不循环` });
                    }
                  }
                  break;
                }
              }
            }
          }
        }
      }
    }
  }

  validateSpawns(arr) {
    for (let i = 0; i < arr.length; i++) {
      const s = arr[i];
      if (!s.entry_id) this.validationErrors.push({ type:'error', file:'spawns.json', msg:`#${i+1}: 缺少 entry_id` });
      if (s.world === undefined) this.validationErrors.push({ type:'error', file:'spawns.json', msg:`#${i+1}: 缺少 world` });
    }
  }

  validatePortals(arr) {
    for (let i = 0; i < arr.length; i++) {
      const p = arr[i];
      if (!p.id) this.validationErrors.push({ type:'error', file:'portals.json', msg:`#${i+1}: 缺少 id` });
      if (p.world === p.dest_world && p.world !== undefined) {
        this.validationErrors.push({ type:'warning', file:'portals.json', msg:`#${i+1} "${p.id}": 同世界传送 (w${p.world}→w${p.dest_world})` });
      }
    }
  }

  validateScenarios(arr) {
    for (let i = 0; i < arr.length; i++) {
      const sc = arr[i];
      if (!sc.name) this.validationErrors.push({ type:'warning', file:'scenarios.json', msg:`#${i+1}: 缺少 name` });
      if (!sc.spawn_points || sc.spawn_points.length === 0) {
        this.validationErrors.push({ type:'warning', file:'scenarios.json', msg:`#${i+1} "${sc.name}": 没有出生点` });
      }
      if (!sc.waves || sc.waves.length === 0) {
        this.validationErrors.push({ type:'warning', file:'scenarios.json', msg:`#${i+1} "${sc.name}": 没有波次配置` });
      }
      if (!sc.objectives || sc.objectives.length === 0) {
        this.validationErrors.push({ type:'warning', file:'scenarios.json', msg:`#${i+1} "${sc.name}": 没有目标` });
      }
    }
  }

  validateShops(arr) {
    for (let i = 0; i < arr.length; i++) {
      const sh = arr[i];
      if (!sh.id) this.validationErrors.push({ type:'error', file:'shop_items.json', msg:`#${i+1}: 缺少 id` });
      if (!sh.items || sh.items.length === 0) {
        this.validationErrors.push({ type:'warning', file:'shop_items.json', msg:`#${i+1} "${sh.id}": 没有商品` });
      }
    }
  }

  validateMobs(arr) {
    for (let i = 0; i < arr.length; i++) {
      const m = arr[i];
      if (!m.name) this.validationErrors.push({ type:'warning', file:'mmo/mmo_mobs.json', msg:`#${i+1}: 缺少 name` });
      if (!m.skin) this.validationErrors.push({ type:'warning', file:'mmo/mmo_mobs.json', msg:`#${i+1} "${m.name}": 缺少 skin` });
    }
  }

  getValidItemIds() {
    const items = this.getRefData('mmo/mmo_items.json');
    const ids = new Set();
    for (const item of items) {
      const id = item.id ?? item.item_id;
      if (id !== undefined && id !== null && id !== '') ids.add(String(id));
    }
    return ids;
  }

  validateItems(arr) {
    const validGroups = KNOWN_ENUMS['mmo/mmo_items.json.group'] || [];
    const validTypes = KNOWN_ENUMS['mmo/mmo_items.json.type'] || [];
    const validRarities = KNOWN_ENUMS['mmo/mmo_items.json.rarity'] || [];
    for (let i = 0; i < arr.length; i++) {
      const item = arr[i];
      const label = item.name || item.id || `#${i + 1}`;
      if (item.id === undefined || item.id === null || item.id === '') {
        this.validationErrors.push({ type: 'error', file: 'mmo/mmo_items.json', msg: `#${i + 1}: 缺少 id` });
      }
      if (!item.name) {
        this.validationErrors.push({ type: 'warning', file: 'mmo/mmo_items.json', msg: `#${i + 1} "${label}": 缺少 name` });
      }
      if (item.group && !validGroups.includes(item.group)) {
        this.validationErrors.push({ type: 'error', file: 'mmo/mmo_items.json', msg: `"${label}": 未知 group "${item.group}"` });
      }
      if (item.type && !validTypes.includes(item.type)) {
        this.validationErrors.push({ type: 'error', file: 'mmo/mmo_items.json', msg: `"${label}": 未知 type "${item.type}"` });
      }
      if (item.rarity && !validRarities.includes(item.rarity)) {
        this.validationErrors.push({ type: 'warning', file: 'mmo/mmo_items.json', msg: `"${label}": 未知 rarity "${item.rarity}"` });
      }
    }
  }

  validateWorldBoss(data) {
    if (!data) return;
    const validIds = this.getValidItemIds();
    const checkItems = (items, ctx) => {
      if (!items || !Array.isArray(items)) return;
      for (let j = 0; j < items.length; j++) {
        const it = items[j];
        const idStr = String(it.id ?? '');
        if (!idStr || idStr === 'undefined') {
          this.validationErrors.push({ type: 'error', file: 'mmo/world_boss.json', msg: `${ctx}: 物品 #${j + 1} 缺少 id` });
        } else if (validIds.size > 0 && !validIds.has(idStr)) {
          this.validationErrors.push({ type: 'error', file: 'mmo/world_boss.json', msg: `${ctx}: 未知物品 id ${idStr}` });
        }
      }
    };
    if (!data.boss) {
      this.validationErrors.push({ type: 'error', file: 'mmo/world_boss.json', msg: '缺少 boss 配置' });
    }
    if (!data.rewards) {
      this.validationErrors.push({ type: 'warning', file: 'mmo/world_boss.json', msg: '缺少 rewards 配置' });
      return;
    }
    if (data.rewards.tiers) {
      for (let i = 0; i < data.rewards.tiers.length; i++) {
        const tier = data.rewards.tiers[i];
        checkItems(tier.items, `档位 #${i + 1} (排名 ${tier.rank_min}–${tier.rank_max})`);
      }
    }
    if (data.rewards.kill_bonus) {
      checkItems(data.rewards.kill_bonus.items, '击杀奖励 kill_bonus');
    }
  }

  validateRecipes(arr) {
    for (let i = 0; i < arr.length; i++) {
      const r = arr[i];
      if (!r.ingredients || r.ingredients.length === 0) {
        this.validationErrors.push({ type:'warning', file:'craft_recipes.json', msg:`#${i+1} "${r.name}": 没有材料` });
      }
      if (!r.result_item_id) {
        this.validationErrors.push({ type:'warning', file:'craft_recipes.json', msg:`#${i+1} "${r.name}": 没有产物` });
      }
    }
  }

  renderValidation() {
    const panel = $('valContent');
    panel.innerHTML = '';
    if (this.validationErrors.length === 0) {
      panel.innerHTML = '<div style="padding:12px;color:var(--success)">✅ 一切都好，没有发现问题。</div>';
      return;
    }
    for (const v of this.validationErrors) {
      const item = document.createElement('div');
      item.className = `validation-item ${v.type}`;
      item.innerHTML = `<span class="vi-type">${v.type === 'error' ? '❌' : '⚠️'}</span>
        <span class="vi-msg"><strong>${v.file}</strong> ${escHtml(v.msg)}</span>`;
      panel.appendChild(item);
    }
  }

  toggleValidation() {
    const p = $('valPanel');
    if (p.classList.contains('open')) {
      p.classList.remove('open');
    } else {
      this.validate();
      p.classList.add('open');
    }
  }

  async createProjectFilesFromData(data) {
    let created = 0, failed = 0;
    for (const [path, content] of Object.entries(data)) {
      try {
        const fh = await this.dirHandle.getFileHandle(path, { create: true });
        const writable = await fh.createWritable();
        await writable.write(JSON.stringify(content, null, 4));
        await writable.close();
        created++;
      } catch(err) {
        console.warn('Create file failed:', path, err);
        failed++;
      }
    }
    if (failed > 0) toast(`${created} 个文件创建成功, ${failed} 个失败`, 'warning');
    else toast(`✅ 已创建 ${created} 个文件`, 'success');
  }

      // Parse steps
      const stepRows = overlay.querySelectorAll('.quick-step');
      const dialogs = [];
      for (const row of stepRows) {
        const id = row.querySelector('.qs-id').value.trim();
        const cond = row.querySelector('.qs-cond').value.trim();
        const text = row.querySelector('.qs-text').value.trim();
        if (!id) continue;

        const step = { id, conditions:{}, actions:[] };
        if (text) step.text = text.split('|').map(s => s.trim()).filter(Boolean);
        else step.text = ['(对话内容)'];

        // Parse conditions
        if (cond) {
          for (const part of cond.split(/[,;]/)) {
            const [ck, cv] = part.trim().split(':');
            if (ck === 'flag') step.conditions.flag = cv || '';
            else if (ck === 'not') step.conditions.not_flag = cv || '';
            else if (ck === 'lv' || ck === 'level') step.conditions.level_ge = parseInt(cv,10) || 1;
            else if (ck === 'rep' || ck === 'reputation') step.conditions.reputation_ge = parseInt(cv,10) || 0;
            else if (ck === 'gold') step.conditions.gold_ge = parseInt(cv,10) || 0;
          }
        }

        // Parse actions
        const act = row.querySelector('.qs-act').value.trim();
        if (act) {
          for (const part of act.split(/[,;]/)) {
            const [ak, av] = part.trim().split(':');
            if (ak === 'sf' || ak === 'set_flag') step.actions.push({ type:'set_flag', key:av || '', value:1 });
            else if (ak === 'rf' || ak === 'clear_flag') step.actions.push({ type:'clear_flag', key:av || '' });
            else if (ak === 'gold') step.actions.push({ type:'add_gold', value:parseInt(av,10) || 0 });
            else if (ak === 'rep' || ak === 'reputation') step.actions.push({ type:'add_reputation', value:parseInt(av,10) || 10 });
            else if (ak === 'heal') step.actions.push({ type:'heal', value:parseInt(av,10) || 30 });
            else if (ak === 'msg' || ak === 'message') step.actions.push({ type:'message', value:av || '' });
            else if (ak === 'shop') step.actions.push({ type:'open_shop', key:av || 'general' });
            else if (ak === 'item' || ak === 'give_item') step.actions.push({ type:'add_item', key:av || '', value:1 });
            else if (ak === 'quest' || ak === 'start_quest') step.actions.push({ type:'start_quest', key:av || '', value:0 });
          }
        }

        dialogs.push(step);
      }

      if (dialogs.length === 0) { toast('至少需要 1 个对话步骤','error'); return; }

      // Build NPC entry
      const entry = {
        id: npcId,
        name_key: npcName || 'npc.' + npcId + '.name',
        skin: npcSkin,
        decoration: '',
        emote: 'NORMAL',
        dialogs: dialogs
      };

      arr.push(entry);
      this.markDataChanged('npcs.json');
      this.selectEntry(arr.length - 1);
      overlay.remove();
      toast(`✨ NPC "${npcId}" 创建成功! (${dialogs.length} 步对话)`, 'success');
    });
  }

  // ====== 删除条目 ======
  deleteCurrentEntry() {
    if (this.currentEntryIdx < 0 || !this.currentFile) return;
    const arr = this.getEntryArray(this.currentFile);
    if (!arr || arr.length === 0) return;
    const entry = arr[this.currentEntryIdx];
    const id = this.getEntryId(entry);
    if (!confirm(`确定要删除条目 "${id}" 吗？`)) return;

    arr.splice(this.currentEntryIdx, 1);
    this.currentEntryIdx = Math.min(this.currentEntryIdx, arr.length - 1);
    this.markDataChanged(this.currentFile);
    this.renderSidebar();
    this.renderEditor();
    this.updateUI();
    this.updateStatus();
    toast(`已删除: ${id}`, 'info');
  }

  // ====== 克隆条目 ======
  cloneCurrentEntry() {
    if (this.currentEntryIdx < 0 || !this.currentFile) return;
    const arr = this.getEntryArray(this.currentFile);
    if (!arr || arr.length === 0) return;
    const entry = arr[this.currentEntryIdx];
    const id = this.getEntryId(entry);
    const clone = cloneObj(entry);
    if (typeof id === 'string') {
      clone.id = `${id}_copy_${Date.now().toString(36)}`;
    } else if (typeof id === 'number') {
      clone.id = Math.max(...arr.map(e => typeof this.getEntryId(e)==='number'?this.getEntryId(e):0)) + 1;
    }
    arr.splice(this.currentEntryIdx + 1, 0, clone);
    this.markDataChanged(this.currentFile);
    this.selectEntry(this.currentEntryIdx + 1);
    toast(`已克隆: ${id} → ${clone.id}`, 'success');
  }

  // ====== 保存 ======
  async saveAll() {
    if (this.fileNames.length === 0) { toast('没有文件可以保存','warning'); return; }
    this.validate();
    const errors = this.validationErrors.filter(e => e.type === 'error');
    if (errors.length > 0) {
      if (!confirm(`有 ${errors.length} 个验证错误，仍然保存吗？`)) return;
    }
    let saved = 0, failed = 0;
    if (this.isWeb) {
      // Web mode: batch save via API
      const batch = {};
      for (const fn of this.fileNames) {
        const file = this.files.get(fn);
        if (!file || !file.dirty) continue;
        batch[fn] = file.data;
      }
      if (Object.keys(batch).length === 0) { toast('没有需要保存的更改','info'); return; }
      try {
        const result = await this.apiPut('/save-all', batch);
        if (result.ok) {
          for (const fn of Object.keys(batch)) {
            const file = this.files.get(fn);
            if (file) file.dirty = false;
          }
          saved = result.saved;
          failed = result.failed;
        } else {
          failed = result.failed || 1;
        }
      } catch(err) {
        failed = 1;
        toast('保存失败: '+err.message, 'error');
      }
    } else {
      for (const fn of this.fileNames) {
        const file = this.files.get(fn);
        if (!file || !file.dirty) continue;
        try {
          const jsonStr = JSON.stringify(file.data, null, 4);
          if (file.isFallback) {
            this.downloadJSON(fn, file.data);
            saved++;
          } else if (file.fileHandle) {
            const writable = await file.fileHandle.createWritable();
            await writable.write(jsonStr);
            await writable.close();
            file.dirty = false;
            file.original = jsonStr;
            file.jsonString = jsonStr;
            saved++;
          } else {
            this.downloadJSON(fn, file.data);
            saved++;
          }
        } catch (err) {
          failed++;
          toast(`保存 ${fn} 失败: ${err.message}`, 'error');
        }
      }
    }
    this.renderTabs();
    this.updateStatus();
    const dest = this.isWeb ? 'server_content' : '磁盘';
    toast(failed === 0 ? `已写入 ${dest}：${saved} 个文件` : `写入 ${dest}：${saved} 成功, ${failed} 失败`, failed > 0 ? 'warning' : 'success');
  }

  async saveCurrentFile() {
    if (!this.currentFile) return;
    const file = this.files.get(this.currentFile);
    if (!file) return;
    // Web: save single file via API
    if (this.isWeb) {
      try {
        await this.apiPut('/file/' + this.currentFile, file.data);
        file.dirty = false;
        this.renderTabs();
        this.updateStatus();
        toast('已保存','success');
      } catch(e) {
        toast('保存失败: '+e.message,'error');
      }
      return;
    }
    try {
      const jsonStr = JSON.stringify(file.data, null, 4);
      if (file.isFallback) {
        this.downloadJSON(this.currentFile, file.data);
      } else if (file.fileHandle) {
        const writable = await file.fileHandle.createWritable();
        await writable.write(jsonStr);
        await writable.close();
        file.dirty = false;
        file.original = jsonStr;
        file.jsonString = jsonStr;
      }
      this.renderTabs();
      this.updateStatus();
      toast(`已保存 ${this.currentFile}`, 'success');
    } catch (err) {
      toast(`保存失败: ${err.message}`, 'error');
    }
  }

  downloadJSON(fileName, data) {
    const blob = new Blob([JSON.stringify(data, null, 4)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  // ====== UI 状态 ======
  updateUI() {
    const hasFile = !!this.currentFile;
    const arr = this.getEntryArray(this.currentFile);
    const hasEntry = this.currentEntryIdx >= 0 && arr && this.currentEntryIdx < arr.length;
    $('btnSaveAll').disabled = this.fileNames.length === 0;
    $('btnAddEntry').disabled = !hasFile || !arr;
    $('btnDeleteEntry').disabled = !hasEntry;
    $('btnCloneEntry').disabled = !hasEntry;
    $('sidebarAdd').disabled = !hasFile || !arr;
    $('sidebarDelete').disabled = !hasEntry;
    $('sidebarSearch').disabled = !hasFile;
    const qnpc = $('sidebarQuickNPC');
    if (qnpc) { qnpc.style.display = (this.currentFile === 'npcs.json' && hasFile) ? '' : 'none'; }
  }

  updateStatus() {
    const arr = this.currentFile ? this.getEntryArray(this.currentFile) : null;
    const itemCount = arr ? arr.length : (this.currentFile && SINGLE_OBJECT_FILES.has(this.currentFile) ? 1 : 0);
    $('statusFileCount').textContent = `📂 ${this.fileNames.length} 文件`;
    $('statusItemCount').textContent = `📋 ${itemCount} 条目`;
    const dirtyCount = Array.from(this.files.values()).filter(f => f.dirty).length;
    $('statusDirty').innerHTML = dirtyCount > 0 ? `<span class="status-warn">⚠️ ${dirtyCount} 文件未保存</span>` : `<span class="status-ok">✅ 已保存</span>`;
    const errCount = this.validationErrors.length;
    $('statusValidation').innerHTML = errCount > 0 ? `<span class="status-err">❌ ${errCount} 个问题</span>` : (this.fileNames.length > 0 ? `<span class="status-ok">✅ 验证通过</span>` : '就绪');
  }
}

// ====== 初始化 ======
let app;
document.addEventListener('DOMContentLoaded', () => {
  app = new App();
  window.app = app;
  // 如果支持 File System Access，尝试隐藏 fallback
  if (!window.showDirectoryPicker) {
    console.log('📎 Fallback mode: 使用文件上传');
  }
});

// ====== 键盘快捷键 ======
document.addEventListener('keydown', (e) => {
  if (!app) return;
  if ((e.ctrlKey || e.metaKey) && e.key === 's') {
    e.preventDefault();
    e.shiftKey ? app.saveAll() : app.saveCurrentFile();
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 'n') {
    e.preventDefault();
    app.showNewEntryDialog();
  }
});

console.log('🎮 Server Content Editor v2 — TeeDefenceArchive');

// ── Web 自动连接 / file:// 提示 ──
if (IS_WEB_APP) {
  (async () => {
    try {
      const status = await fetch(API_BASE + '/status').then(r => r.json());
      if (status.ok) {
        console.log('📡 API server connected:', status);
        await app.openFolder();
      }
    } catch(e) {
      console.warn('⚠️ API server not reachable:', e.message);
    }
  })();
} else if (window.location.protocol === 'file:') {
  document.addEventListener('DOMContentLoaded', () => {
    toast('提示：运行 python3 tools/editor_server.py 后可直连写入 server_content', 'info');
  });
}

// ── Ctrl+S 保存 ──
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 's') {
    e.preventDefault();
    if (app.files.size > 0) {
      app.saveAll();
      // Brief visual feedback
      const status = document.getElementById('statusDirty');
      if (status) {
        status.innerHTML = '✅ 已保存';
        status.style.color = 'var(--success)';
        setTimeout(() => { status.style.color = ''; }, 1500);
      }
    }
  }
});

// ── 孤立 flag 可视化（在 story map 中已集成）──
// 验证面板中也增加 flag 孤立检测
// 按 Ctrl+Shift+V 打开验证面板
let valOpenShortcut = false;
document.addEventListener('keydown', (e) => {
  if (e.ctrlKey && e.shiftKey && e.key === 'V') {
    e.preventDefault();
    app.validate();
    app.toggleValidation();
  }
});
