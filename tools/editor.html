<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Server Content Editor - TeeDefenceArchive</title>
<style>
:root {
  --bg-primary: #0d1117;
  --bg-secondary: #161b22;
  --bg-tertiary: #1c2333;
  --bg-card: #21262d;
  --bg-hover: #30363d;
  --bg-active: #1f6feb22;
  --bg-input: #0d1117;
  --border: #30363d;
  --border-focus: #58a6ff;
  --text-primary: #e6edf3;
  --text-secondary: #8b949e;
  --text-muted: #6e7681;
  --accent: #58a6ff;
  --accent-hover: #79c0ff;
  --success: #3fb950;
  --warning: #d29922;
  --danger: #f85149;
  --danger-hover: #ff6b62;
  --orange: #d76e2e;
  --purple: #bc8cff;
  --cyan: #39d2c0;
  --font-mono: 'Cascadia Code','JetBrains Mono','SF Mono','Consolas',monospace;
  --font-ui: -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif;
  --sidebar-width: 30%;
  --tab-height: 40px;
  --radius: 6px;
  --radius-sm: 4px;
  --transition: 150ms ease;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font-ui);background:var(--bg-primary);color:var(--text-primary);font-size:13px;line-height:1.5;display:flex;flex-direction:column}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--text-muted)}

.graph-view-container{position:relative;min-height:200px;padding:10px 0}
.graph-view-container svg.connector-lines{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1}
.graph-node-wrapper{position:relative;z-index:2;margin-bottom:8px}
.graph-node-card{position:relative;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:8px 10px;cursor:pointer;transition:border-color var(--transition),box-shadow var(--transition);user-select:none}
.graph-node-card:hover{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.graph-node-card.drag-over{border-color:var(--success);box-shadow:0 0 0 2px var(--success)}
.graph-node-header{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.graph-node-badge{font-size:11px;font-weight:600;color:var(--purple);min-width:26px}
.graph-node-id{flex:1;font-family:var(--font-mono);font-size:11px;color:var(--accent);font-weight:500}
.graph-node-del{color:var(--danger);cursor:pointer;font-size:12px;padding:2px 4px;border:none;background:none;opacity:.6;transition:opacity var(--transition)}
.graph-node-del:hover{opacity:1}
.graph-node-text{font-size:11px;color:var(--text-secondary);padding:2px 0;line-height:1.4;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2}
.graph-node-tags{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
.graph-tag{display:inline-flex;align-items:center;gap:2px;padding:1px 6px;border-radius:3px;font-size:9px;font-weight:500;line-height:1.4}
.graph-tag-cond{background:rgba(215,110,46,.15);color:var(--orange)}
.graph-tag-action{background:rgba(57,210,192,.15);color:var(--cyan)}
.graph-node-expanded{border:1px solid var(--border);border-top:0;border-radius:0 0 var(--radius-sm) var(--radius-sm);background:var(--bg-tertiary);padding:6px 8px;margin-top:-1px}
.graph-node-add-inset{text-align:center;padding:2px 0}
.graph-node-add-inset button{padding:2px 10px;background:transparent;border:1px dashed var(--border);border-radius:var(--radius-sm);color:var(--text-muted);cursor:pointer;font-size:10px;transition:color var(--transition)}
.graph-node-add-inset button:hover{color:var(--text-primary);border-color:var(--text-muted)}
.graph-drag-hint{text-align:center;font-size:9px;color:var(--text-muted);padding:2px 0;cursor:ns-resize;user-select:none}

/* Top Bar */
.top-bar{display:flex;align-items:center;padding:0 12px;height:44px;background:var(--bg-secondary);border-bottom:1px solid var(--border);gap:10px;flex-shrink:0}
.top-bar h1{font-size:14px;font-weight:600;color:var(--accent);white-space:nowrap}
.top-bar h1 span{color:var(--text-secondary);font-weight:400}
.btn{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-tertiary);color:var(--text-primary);font-size:12px;cursor:pointer;transition:background var(--transition),border-color var(--transition);white-space:nowrap;user-select:none}
.btn:hover{background:var(--bg-hover);border-color:var(--text-muted)}
.btn:active{transform:scale(0.97)}
.btn-primary{background:#1f6feb;border-color:#1f6feb;color:#fff}
.btn-primary:hover{background:#388bfd;border-color:#388bfd}
.btn-danger{border-color:var(--danger);color:var(--danger)}
.btn-danger:hover{background:var(--danger);color:#fff}
.btn-success{border-color:var(--success);color:var(--success)}
.btn-success:hover{background:var(--success);color:#fff}
.btn-sm{padding:3px 8px;font-size:11px}
.btn-icon{padding:4px 8px;font-size:14px;line-height:1}
.spacer{flex:1}
.btn:disabled{opacity:0.4;cursor:not-allowed}

/* Tab Bar */
.tab-bar{display:flex;align-items:center;height:var(--tab-height);background:var(--bg-secondary);border-bottom:1px solid var(--border);overflow-x:auto;overflow-y:hidden;flex-shrink:0;padding:0}
.tab-bar::-webkit-scrollbar{height:3px}
.tab-item{display:flex;align-items:center;gap:6px;padding:0 14px;height:100%;border-right:1px solid var(--border);font-size:12px;color:var(--text-secondary);cursor:pointer;transition:background var(--transition),color var(--transition);white-space:nowrap;user-select:none}
.tab-item:hover{background:var(--bg-hover);color:var(--text-primary)}
.tab-item.active{background:var(--bg-primary);color:var(--accent);border-bottom:2px solid var(--accent)}
.tab-item .dirty-mark{color:var(--warning);font-weight:bold}
.tab-item .tab-count{color:var(--text-muted);font-size:10px;margin-left:4px}

/* Main Layout */
.main-layout{display:flex;flex:1;overflow:hidden}

/* Sidebar */
.sidebar{width:var(--sidebar-width);min-width:220px;max-width:400px;background:var(--bg-secondary);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.sidebar-header{padding:8px 12px;border-bottom:1px solid var(--border);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);display:flex;justify-content:space-between;align-items:center}
.sidebar-header .badge{background:var(--bg-tertiary);padding:1px 8px;border-radius:10px;font-size:10px;color:var(--text-secondary)}
.sidebar-search{padding:6px 10px;border-bottom:1px solid var(--border)}
.sidebar-search input{width:100%;padding:5px 8px;background:var(--bg-primary);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-primary);font-size:12px;outline:none;transition:border-color var(--transition)}
.sidebar-search input:focus{border-color:var(--border-focus)}
.sidebar-list{flex:1;overflow-y:auto;padding:4px 0}
.item-entry{display:flex;align-items:center;padding:6px 12px;cursor:pointer;transition:background var(--transition);gap:8px;font-size:12px}
.item-entry:hover{background:var(--bg-hover)}
.item-entry.active{background:var(--bg-active);border-left:3px solid var(--accent)}
.item-entry .item-id{font-family:var(--font-mono);font-size:11px;color:var(--accent);flex-shrink:0}
.item-entry .item-name{color:var(--text-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.sidebar-actions{padding:8px 12px;border-top:1px solid var(--border);display:flex;gap:6px;flex-wrap:wrap}

/* Editor Panel */
.editor-panel{flex:1;overflow-y:auto;padding:16px;background:var(--bg-primary)}
.editor-panel.empty-state{display:flex;justify-content:center;align-items:center;flex-direction:column;gap:12px;color:var(--text-muted)}
.editor-panel.empty-state .empty-icon{font-size:48px;opacity:.3}
.editor-panel.empty-state p{font-size:14px}

.form-section{margin-bottom:20px}
.form-section-title{font-size:13px;font-weight:600;color:var(--text-secondary);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.special-section-title{font-size:13px;font-weight:600;color:var(--cyan);margin:16px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--cyan);display:flex;align-items:center;gap:8px}

/* Field Rows */
.field-row{display:flex;align-items:flex-start;gap:8px;margin-bottom:6px;padding:4px 8px;border-radius:var(--radius-sm);transition:background var(--transition)}
.field-row:hover{background:var(--bg-tertiary)}
.field-row .field-label{width:120px;min-width:80px;font-size:11px;color:var(--text-secondary);padding-top:5px;flex-shrink:0;word-break:break-all}
.field-row .field-label .field-type{display:block;font-size:9px;color:var(--text-muted);font-family:var(--font-mono)}
.field-label .field-desc{display:block;font-size:10px;color:var(--text-muted);font-weight:normal;margin-top:2px;line-height:1.3}
.field-row .field-input{flex:1;min-width:0}
.field-row input[type="text"],.field-row input[type="number"],.field-row textarea,.field-row select{width:100%;padding:5px 8px;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-primary);font-size:12px;font-family:var(--font-ui);outline:none;transition:border-color var(--transition)}
.field-row input[type="text"]:focus,.field-row input[type="number"]:focus,.field-row textarea:focus,.field-row select:focus{border-color:var(--border-focus)}
.field-row input[type="number"]{width:120px}
.field-row textarea{min-height:60px;resize:vertical;font-family:var(--font-mono);font-size:11px;line-height:1.6}
.field-row input[type="checkbox"]{width:16px;height:16px;accent-color:var(--accent);margin-top:4px;cursor:pointer}

/* Array Table */
.array-table{width:100%;border-collapse:collapse;margin:4px 0}
.array-table th{text-align:left;font-size:10px;font-weight:600;color:var(--text-muted);text-transform:uppercase;padding:4px 8px;border-bottom:1px solid var(--border)}
.array-table td{padding:3px 8px;border-bottom:1px solid var(--border);vertical-align:middle}
.array-table tr:hover td{background:var(--bg-tertiary)}
.array-table input,.array-table select{width:100%;padding:3px 6px;background:transparent;border:1px solid transparent;border-radius:var(--radius-sm);color:var(--text-primary);font-size:12px;outline:none;transition:border-color var(--transition)}
.array-table input:focus,.array-table select:focus{border-color:var(--border-focus);background:var(--bg-input)}
.array-table .btn-icon{padding:2px 6px;font-size:13px}
.add-btn{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;margin:6px 0;border:1px dashed var(--border);border-radius:var(--radius-sm);background:transparent;color:var(--text-secondary);font-size:11px;cursor:pointer;transition:all var(--transition)}
.add-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--bg-active)}

/* Tag Input */
.tag-input-wrap{display:flex;flex-wrap:wrap;gap:4px;padding:4px;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius-sm);min-height:28px;align-items:center}
.tag-input-wrap:focus-within{border-color:var(--border-focus)}
.tag-item{display:inline-flex;align-items:center;gap:3px;padding:1px 8px;background:var(--bg-tertiary);border:1px solid var(--border);border-radius:12px;font-size:11px;color:var(--text-primary)}
.tag-item .tag-remove{cursor:pointer;font-size:12px;line-height:1;color:var(--text-muted);padding:0 2px}
.tag-item .tag-remove:hover{color:var(--danger)}
.tag-input-field{border:none!important;background:transparent!important;outline:none;min-width:60px;flex:1;padding:2px 4px;font-size:12px;color:var(--text-primary)}

/* Nested Object */
.nested-object{border:1px solid var(--border);border-radius:var(--radius-sm);margin:4px 0;overflow:hidden}
.nested-object-header{display:flex;align-items:center;gap:6px;padding:4px 8px;background:var(--bg-tertiary);cursor:pointer;user-select:none;font-size:11px;color:var(--text-secondary)}
.nested-object-header:hover{background:var(--bg-hover)}
.nested-object-body{padding:6px 8px}
.nested-object-body.collapsed{display:none}

/* Dialog Editor */
.dialog-editor{margin-top:16px}
.dialog-step-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;overflow:hidden}
.dialog-step-card:hover{border-color:var(--text-muted)}
.dialog-step-header{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg-tertiary);border-bottom:1px solid var(--border)}
.dialog-step-header .step-id{flex:1;font-size:12px;color:var(--accent);font-weight:600}
.dialog-step-header .step-summary{flex:1;font-size:11px;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dialog-step-body{padding:10px 12px}
.dialog-step-body .field-row .field-label{width:80px;min-width:60px}

/* Dialog Overlay */
.dialog-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);z-index:1000;display:flex;justify-content:center;align-items:center}
.dialog-overlay.hidden{display:none}
.dialog-box{background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius);width:420px;max-width:90vw;max-height:80vh;overflow-y:auto}
.dialog-box-header{padding:12px 16px;font-size:14px;font-weight:600;border-bottom:1px solid var(--border)}
.dialog-box-body{padding:16px}
.dialog-box-body label{display:block;font-size:11px;color:var(--text-secondary);margin-bottom:4px;margin-top:10px}
.dialog-box-body label:first-child{margin-top:0}
.dialog-box-body input[type="text"],.dialog-box-body input[type="number"],.dialog-box-body select{width:100%;padding:6px 10px;background:var(--bg-primary);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-primary);font-size:12px;outline:none}
.dialog-box-body input:focus,.dialog-box-body select:focus{border-color:var(--border-focus)}
.dialog-box-body .help-text{font-size:10px;color:var(--text-muted);margin-top:2px}
.dialog-box-footer{padding:12px 16px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}

/* Status Bar */
.status-bar{height:32px;background:var(--bg-secondary);border-top:1px solid var(--border);display:flex;align-items:center;padding:0 12px;gap:16px;font-size:11px;color:var(--text-muted);flex-shrink:0}
.status-bar .status-item{display:flex;align-items:center;gap:4px}
.status-ok{color:var(--success)}
.status-warn{color:var(--warning)}
.status-err{color:var(--danger)}

/* Validation Panel */
.validation-panel{position:fixed;right:0;bottom:32px;width:360px;max-height:300px;background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius) var(--radius) 0 0;overflow-y:auto;z-index:100;transform:translateY(calc(100% + 32px));transition:transform .2s}
.validation-panel.open{transform:translateY(0)}
.validation-panel-header{padding:8px 12px;font-size:12px;font-weight:600;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.validation-item{padding:6px 12px;font-size:11px;border-bottom:1px solid rgba(48,54,61,.5);display:flex;gap:6px;align-items:flex-start}
.validation-item .vi-type{flex-shrink:0;font-weight:600}
.validation-item .vi-msg{flex:1}
.validation-item.error{border-left:3px solid var(--danger)}
.validation-item.warning{border-left:3px solid var(--warning)}
.validation-item.info{border-left:3px solid var(--accent)}

/* ── Mobile (< 768px) ── */
@media (max-width:768px){
  .top-bar{gap:2px;padding:2px 4px;flex-wrap:nowrap}
  .top-bar h1{font-size:13px;flex:1;text-align:left;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .top-bar h1 span{display:none}
  .top-bar .btn{font-size:10px;padding:4px 7px}
  .top-bar .btn-sm{font-size:9px;padding:3px 6px}
  .top-bar .web-badge{font-size:8px;padding:1px 4px}
  .top-bar .spacer{display:none}
  /* Hide lesser buttons on narrow screens */
  .top-hide-mobile{display:none!important}
  /* Hamburger */
  .hamburger{display:inline-flex!important}

  .tab-bar{overflow-x:auto;gap:2px;padding:2px 4px;scrollbar-width:none}
  .tab-bar::-webkit-scrollbar{display:none}
  .tab-bar .tab{font-size:9px;padding:4px 7px;white-space:nowrap;flex-shrink:0}
  .tab-bar .tab .close-tab{display:none}

  .main-layout{flex-direction:column;position:relative}

  /* Sidebar: hidden by default, slides in */
  .sidebar{position:fixed;top:0;left:-280px;width:280px;height:100vh;max-height:none;z-index:2000;background:var(--bg-secondary);border-right:1px solid var(--border);border-bottom:none;transition:left .2s ease;box-shadow:4px 0 15px rgba(0,0,0,.5)}
  .sidebar.open{left:0}
  .sidebar-list{max-height:calc(100vh - 120px)}
  .sidebar-search input{font-size:11px;padding:5px 8px}
  .sidebar-actions .btn{font-size:10px;padding:4px 8px}
  /* Overlay when sidebar open */
  .sidebar-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:1999;display:none}
  .sidebar-overlay.show{display:block}

  .editor-panel{padding:4px;overflow-x:hidden}
  .editor-panel .form-section{padding:6px}
  .form-section-title{font-size:11px;padding:5px 6px}

  .form-row{flex-wrap:wrap;gap:2px;margin-bottom:4px}
  .form-row label{min-width:55px;font-size:10px;padding:4px 0}
  .form-row input,.form-row select{font-size:11px;padding:5px 7px;min-height:28px}
  .form-row .help-text{font-size:9px}

  .array-table{font-size:10px}
  .array-table th,.array-table td{padding:3px 4px}
  .array-table input,.array-table select{font-size:10px;padding:2px 4px}

  /* Full-screen dialogs on mobile */
  .dialog-overlay{align-items:flex-end}
  .dialog-box{max-width:100vw!important;width:100vw!important;max-height:85vh;border-radius:12px 12px 0 0;margin:0;animation:dialogSlideUp .25s ease}
  @keyframes dialogSlideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .dialog-box-header{padding:12px 14px;font-size:13px}
  .dialog-box-body{padding:12px 14px}
  .dialog-box-body input,.dialog-box-body select{font-size:13px;padding:8px 10px;min-height:36px}
  .dialog-box-body label{font-size:11px}
  .dialog-box-footer{padding:10px 14px}
  .dialog-box-footer .btn{font-size:12px;padding:8px 14px;min-height:36px}

  .validation-panel{position:fixed;bottom:0;left:0;right:0;max-height:50vh;z-index:100;border-radius:10px 10px 0 0}
  .validation-panel-header{padding:8px 10px;font-size:11px}

  .status-bar{padding:2px 6px;font-size:9px;gap:6px;overflow-x:auto}
  .status-item{white-space:nowrap}

  .empty-state{padding:30px 10px!important}
  .empty-state .empty-icon{font-size:32px}
  .empty-state p{font-size:12px}

  /* Graph view mobile */
  .graph-view-container{overflow-x:auto;padding:4px}
  .graph-node-card{min-width:160px;font-size:10px}
  .graph-arrow,.graph-arrow-label{font-size:8px}

  /* Quick NPC dialog table */
  .npc-step-row{gap:4px;padding:4px;flex-wrap:wrap}
  .npc-step-row input,.npc-step-row select{font-size:10px;padding:3px 5px;min-height:26px}

  /* Misc */
  .info-block{padding:6px;font-size:10px}
  .badge{font-size:9px;padding:1px 5px}
  pre{font-size:9px}
}

/* ── Very small (< 420px) ── */
@media (max-width:420px){
  .top-bar h1{max-width:90px}
  .top-bar .btn{font-size:9px;padding:3px 5px}
  .form-row label{min-width:45px;font-size:9px}
  .dialog-box-header{font-size:12px;padding:10px 12px}
  .dialog-box-body{padding:10px 12px}
}

/* Web indicator */
.web-badge{display:inline-flex;align-items:center;gap:3px;font-size:9px;padding:2px 7px;border-radius:10px;background:rgba(57,210,192,.15);color:var(--cyan)}
</style>
</head>
<body>

<div class="top-bar">
  <button class="btn hamburger" onclick="app.toggleSidebar()" title="菜单" style="display:none;font-size:16px;padding:4px 8px">☰</button>
  <h1>📦 Server Content <span>Editor</span></h1>
  <button class="btn" id="btnOpenFolder" onclick="app.openFolder()">📂 打开</button>
  <button class="btn" onclick="app.saveAll()" id="btnSaveAll">💾 保存</button>
  <span class="web-badge" id="modeBadge" style="display:none">📡 服务器</span>
  <button class="btn btn-primary btn-sm top-hide-mobile" id="btnAddEntry" onclick="app.showNewEntryDialog()" disabled>➕ 新增</button>
  <button class="btn btn-danger btn-sm top-hide-mobile" id="btnDeleteEntry" onclick="app.deleteCurrentEntry()" disabled>🗑️ 删除</button>
  <button class="btn btn-sm top-hide-mobile" id="btnCloneEntry" onclick="app.cloneCurrentEntry()" disabled>📋 克隆</button>
  <span class="spacer"></span>
  <button class="btn btn-sm top-hide-mobile" onclick="app.toggleValidation()" title="验证">✅ 验证</button>
</div>
<div class="sidebar-overlay" id="sidebarOverlay" onclick="app.toggleSidebar()"></div>

<div class="tab-bar" id="tabBar"></div>

<div class="main-layout">
  <div class="sidebar">
    <div class="sidebar-header">
      <span>📋 条目列表</span>
      <span class="badge" id="entryCount">0</span>
    </div>

function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function humanizeField(k) { return k.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase()); }
function cloneObj(o) { return JSON.parse(JSON.stringify(o)); }

// ====== TOAST ======
function toast(msg, type) {
  const el = document.createElement('div');
  el.style.cssText = `position:fixed;bottom:44px;right:16px;padding:8px 16px;border-radius:6px;font-size:12px;z-index:2000;transition:opacity .3s;background:${type==='error'?'var(--danger)':type==='warning'?'var(--warning)':type==='success'?'var(--success)':'var(--bg-tertiary)'};color:#fff;border:1px solid var(--border)`;
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => { el.style.opacity='0'; setTimeout(() => el.remove(), 300); }, 2000);
}

// ====== Web API 模式 ======
const IS_WEB_APP = window.location.protocol === 'http:' || window.location.protocol === 'https:';
const API_BASE = window.location.origin + '/api';

// ====== APP ======
class App {
  constructor() {
    this.dirHandle = null;
    this.files = new Map();        // fileName -> { data, dirty, original, jsonString, fileHandle, isFallback }
    this.fileNames = [];
    this.currentFile = null;
    this.currentEntryIdx = -1;
    this.entryFilter = '';
    this.validationErrors = [];
    this.isWeb = IS_WEB_APP;
  }

  // ---- 打开文件夹 ----
  normalizePath(raw) {
    // 处理各种可能的路径前缀：直接匹配 FILE_META 的 key
    if (FILE_META[raw]) return raw;
    // 处理 webkitRelativePath 可能带 server_content/ 前缀的情况
    const parts = raw.split('/');
    const basename = parts[parts.length-1];
    // 尝试不同的子目录组合
    for (const key of Object.keys(FILE_META)) {
      if (key === raw) return key;
      if (key.endsWith('/'+basename)) return key;
      // 匹配 server_content/npcs.json → npcs.json
      if (raw.replace(/^(?:server_content|ServerContent|data|Data)\/?/, '') === key) return key;
      // 匹配 server_content/mmo/mmo_items.json → mmo/mmo_items.json
      const stripped = raw.replace(/^(?:server_content|ServerContent|data|Data)\//, '');
      if (stripped === key) return key;
    }
    // 尝试只匹配 basename (用于根目录文件)
    if (FILE_META[basename]) return basename;
    return raw;
  }

  async openFolder() {
    // Web mode: load from server API
    if (this.isWeb) {
      this.resetFiles();
      const result = await this.loadFromApi();
      if (result) toast('📁 已连接 — 保存将直接写入 server_content');
      return;
    }
    // Desktop mode: File System Access API
    if (!window.showDirectoryPicker) {
      const input = document.createElement('input');
      input.type = 'file';
      input.webkitdirectory = true;
      input.onchange = (e) => this.handleUploadFolder(e.target);
      input.click();
      return;
    }
    try {
      this.dirHandle = await window.showDirectoryPicker({ id:'tdasc', mode:'readwrite' });
      this.resetFiles();
      console.log('📂 Opened folder, scanning...');
      await this.loadDirFiles(this.dirHandle, '', true);
    } catch (err) {
      if (err.name !== 'AbortError') toast('打开失败: '+err.message, 'error');
    }
  }

  async loadFromApi() {
    try {
      this.resetFiles();
      const flist = await this.apiGet('/files');
      let loaded = 0;
      for (const f of flist) {
        if (!f.exists) continue;
        try {
          const resp = await this.apiGet('/file/' + f.path);
          this.files.set(f.path, { data:resp.data, dirty:false, original:null, jsonString:null, isFallback:true, isWeb:true });
          if (!this.fileNames.includes(f.path)) this.fileNames.push(f.path);
          loaded++;
        } catch(e) { console.warn('Load failed:', f.path, e); }
      }
      if (loaded > 0) {
        this.afterLoad();
        return true;
      }
      toast('服务器上未找到数据文件', 'warning');
      return false;
    } catch(e) {
      toast('连接服务器失败: '+e.message, 'error');
      return false;
    }
  }

  resetFiles() {
    this.files.clear();
    this.fileNames = [];
    this.currentFile = null;
    this.currentEntryIdx = -1;
    this.entryFilter = '';
    this.dialogPage = 0;
  }

  // ── Mobile sidebar toggle ──
  toggleSidebar() {
    const s = document.querySelector('.sidebar');
    const o = document.getElementById('sidebarOverlay');
    if (!s) return;
    s.classList.toggle('open');
    if (o) o.classList.toggle('show');
  }

  // ── Web API helpers ──
  async apiGet(path) {
    const r = await fetch(API_BASE + path);
    if (!r.ok) throw new Error(`API GET ${path}: ${r.status}`);
    return r.json();
  }
  async apiPut(path, data) {
    const r = await fetch(API_BASE + path, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data),
    });
    if (!r.ok) throw new Error(`API PUT ${path}: ${r.status}`);
    return r.json();
  }

  handleUploadFolder(input) {
    const files = Array.from(input.files);
    this.resetFiles();
    console.log('📎 Fallback upload:', files.length, 'files reported');
    const pending = [];
    for (const f of files) {
      const raw = f.webkitRelativePath || f.name;
      const path = this.normalizePath(raw);
      if (FILE_META[path]) pending.push({ f, path });
      else console.log('  skipped:', raw);
    }
    console.log('📎 Matched', pending.length, 'files');
    let loaded = 0;
    for (const { f, path } of pending) {
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const data = JSON.parse(e.target.result);
          this.files.set(path, { data, dirty:false, original:e.target.result, jsonString:e.target.result, isFallback:true });
          if (!this.fileNames.includes(path)) this.fileNames.push(path);
        } catch(err) { console.warn('Parse error', path, err); }
        loaded++;
        if (loaded === pending.length) this.afterLoad();
      };
      reader.readAsText(f);
    }
    if (pending.length === 0) { toast('未找到 server_content JSON 文件', 'warning'); }
  }

  async loadDirFiles(dirHandle, prefix, isRoot) {
    for await (const entry of dirHandle.values()) {
      if (entry.kind === 'file') {
        const raw = prefix ? prefix+'/'+entry.name : entry.name;
        const path = this.normalizePath(raw);
        if (!FILE_META[path]) { console.log('  skip:', raw); continue; }
        try {
          const file = await entry.getFile();
          const text = await file.text();
          const data = JSON.parse(text);
          this.files.set(path, { data, dirty:false, original:text, jsonString:text, fileHandle:entry });
          this.fileNames.push(path);
          console.log('  loaded:', path);
        } catch(err) { console.warn('Load error', path, err); }
      } else if (entry.kind === 'directory') {
        const sub = prefix ? prefix+'/'+entry.name : entry.name;
        await this.loadDirFiles(entry, sub, false);
      }
    }
    // 只在根目录递归完成后触发
    if (isRoot) this.afterLoad();
  }

  afterLoad() {
    const badge = document.getElementById('modeBadge');
    if (badge) {
      if (this.isWeb) {
        badge.style.display = 'inline-flex';
        badge.textContent = '📡 直连 server_content';
        badge.title = '保存将直接写入 server_content/';
      } else {
        badge.style.display = 'none';
      }
    }
    this.fileNames.sort((a,b) => {
      const ia = FILE_ORDER.indexOf(a);
      const ib = FILE_ORDER.indexOf(b);
      if (ia !== -1 && ib !== -1) return ia - ib;
      if (ia !== -1) return -1;
      if (ib !== -1) return 1;
      return a.localeCompare(b);
    });
    if (this.fileNames.length > 0) {
      this.switchFile(this.fileNames[0]);
      toast(`已加载 ${this.fileNames.length} 个文件`, 'success');
    } else {
      toast('文件夹中未找到 server_content JSON 文件', 'warning');
    }
    this.renderTabs();
    this.updateUI();
    this.updateStatus();
  }

  // ---- 文件切换 ----
  switchFile(fileName) {
    this.currentFile = fileName;
    this.currentEntryIdx = -1;
    this.entryFilter = '';
    $('sidebarSearch').value = '';
    this.renderSidebar();
    this.renderEditor();
    this.renderTabs();
    this.updateUI();
    this.updateStatus();
  }

  // ---- 获取条目数组 ----
  getEntryArray(fileName) {
    const file = this.files.get(fileName);
    if (!file || !file.data) return null;
    const meta = FILE_META[fileName];
    if (!meta) return null;
    if (fileName === 'td/index.json' || fileName === 'mmo/world_boss.json') return null; // 单对象
    return file.data[meta.key];
  }

  // ---- 获取条目 ID ----
  getEntryId(entry) {
    if (!entry) return '';
    return entry.entry_id ?? entry.id ?? entry.name ?? JSON.stringify(entry).slice(0,30);
  }

  // ---- 获取条目显示名 ----
  getEntryName(entry) {
    if (!entry) return '(空)';
    if (this.currentFile === 'spawns.json') {
      const npc = entry.npc_id || '?';
      return `${npc} @ w${entry.world} (${entry.x},${entry.y})`;
    }
    if (this.currentFile === 'worlds.json') return entry.name || entry.name_key || `World ${entry.id}`;
    if (this.currentFile === 'portals.json') return `${entry.id || '?'} (w${entry.world}→w${entry.dest_world})`;
    if (this.currentFile === 'quests.json') return entry.title_key || entry.id;
    if (this.currentFile === 'scenarios.json') return entry.name || `Scenario #${entry.id}`;
    if (this.currentFile === 'shop_items.json') return entry.name || entry.id;
    if (this.currentFile === 'mmo/world_spawns.json') {
      const cnt = entry.spawns ? entry.spawns.length : 0;
      return `World ${entry.id} - ${cnt} spawns`;
    }
    if (this.currentFile === 'td/enemies.json') return entry.name || `Enemy #${entry.id}`;
    if (this.currentFile === 'td/effects.json') return entry.name || entry.id;
    return entry.name || entry.name_key || entry.id || entry.entry_id || `#${JSON.stringify(entry).slice(0,20)}`;
  }

  // ---- 渲染 Tabs ----
  renderTabs() {
    const bar = $('tabBar');
    bar.innerHTML = '';
    if (this.fileNames.length === 0) {
      bar.innerHTML = '<div style="color:var(--text-muted);padding:0 14px;font-size:12px;">请先打开 server_content/ 文件夹</div>';
      return;
    }
    for (const fn of this.fileNames) {
      const meta = FILE_META[fn];
      const file = this.files.get(fn);
      const tab = document.createElement('div');
      tab.className = 'tab-item' + (fn === this.currentFile ? ' active' : '');
      tab.dataset.file = fn;
      const arr = this.getEntryArray(fn);
      const count = arr ? arr.length : (SINGLE_OBJECT_FILES.has(fn) ? 1 : 0);
      tab.innerHTML = `
        ${meta ? meta.icon : '📄'}
        <span>${meta ? meta.label : fn}</span>
        ${file?.dirty ? '<span class="dirty-mark">*</span>' : ''}
        <span class="tab-count">${count}</span>
      `;
      tab.addEventListener('click', () => this.switchFile(fn));
      bar.appendChild(tab);
    }
  }

  // ---- 渲染侧栏 ----
  renderSidebar() {
    const list = $('sidebarList');
    const arr = this.getEntryArray(this.currentFile);
    list.innerHTML = '';
    if (!arr) { $('entryCount').textContent = '0'; return; }
    let filtered = arr.map((e,i) => ({ entry:e, index:i }));
    if (this.entryFilter) {
      const f = this.entryFilter.toLowerCase();
      filtered = filtered.filter(({entry}) => {
        const id = String(this.getEntryId(entry)).toLowerCase();
        const name = String(this.getEntryName(entry)).toLowerCase();
        return id.includes(f) || name.includes(f);
      });
    }
    $('entryCount').textContent = `${this.currentEntryIdx>=0?this.currentEntryIdx+1:'-'} / ${arr.length}`;
    for (const { entry, index } of filtered) {
      const el = document.createElement('div');
      el.className = 'item-entry' + (index === this.currentEntryIdx ? ' active' : '');
      el.innerHTML = `<span class="item-name">${escHtml(this.getEntryName(entry))}</span>`;
      el.title = String(this.getEntryId(entry));
      el.addEventListener('click', () => this.selectEntry(index));
      list.appendChild(el);
    }
  }

  selectEntry(idx) {
    const arr = this.getEntryArray(this.currentFile);
    if (arr && idx >= 0 && idx < arr.length) this.currentEntryIdx = idx;
    // Mobile: close sidebar on selection
    if (window.innerWidth <= 768) this.toggleSidebar();
    this.dialogPage = 0;
    // Clean up dialog expand keys from previous entry
    for (const key of Object.keys(this)) {
      if (key.startsWith('_dialog_expand_')) delete this[key];
    }
    this.renderSidebar();
    this.renderEditor();
    this.updateUI();
  }

  onFilterChange(val) {
    this.entryFilter = val;
    this.renderSidebar();
  }

  markDirty() {
    const file = this.files.get(this.currentFile);
    if (file) { file.dirty = true; this.renderTabs(); this.updateStatus(); this.updateUI(); }
  }

  markDataChanged(fileName) {
    const file = this.files.get(fileName);
    if (file) file.dirty = true;
  }

  // ====== 获取后段路径引用数据 ======
  getRefData(fileName) {
    const file = this.files.get(fileName);
    if (!file || !file.data) return [];
    const meta = FILE_META[fileName];
    if (!meta || !meta.key) return [];
    const arr = file.data[meta.key];
    return Array.isArray(arr) ? arr : [];
  }

  // ====== 收集所有剧情 flag ======
  collectStoryFlags() {
    const flags = new Set();
    const npcs = this.getRefData('npcs.json');
    for (const npc of npcs) {
      if (!npc.dialogs) continue;
      for (const d of npc.dialogs) {
        // From conditions
        if (d.conditions && typeof d.conditions === 'object' && !Array.isArray(d.conditions)) {
          for (const [ck, cv] of Object.entries(d.conditions)) {
            if (ck === 'flag' || ck === 'not_flag') {
              if (cv && typeof cv === 'string') flags.add(cv);
            }
          }
        }
        // From actions
        if (d.actions) {
          for (const a of d.actions) {
            if (a.type === 'set_flag' && a.key) flags.add(a.key);
          }
        }
      }
    }
    return [...flags].sort();
  }

  // ====== 渲染编辑器（主入口） ======
  renderEditor() {
    const panel = $('editorPanel');
    if (!this.currentFile || !this.files.has(this.currentFile)) {
      panel.className = 'editor-panel empty-state';
      panel.innerHTML = `<div class="empty-icon">📁</div><p>打开 server_content/ 文件夹开始编辑</p>
        <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px">
          <button class="btn btn-primary" onclick="document.getElementById('btnOpenFolder').click()">📂 选择文件夹</button>
          <button class="btn btn-sm" onclick="app.showNewProjectDialog()">📁 新建空白项目</button>
        </div>`;
      return;
    }
    const fileName = this.currentFile;
    const file = this.files.get(fileName);
    const arr = this.getEntryArray(fileName);

    // 单对象文件 (td/index.json, mmo/world_boss.json)
    if (SINGLE_OBJECT_FILES.has(fileName)) {
      panel.className = 'editor-panel';
      const titles = { 'td/index.json':'⚙️ TD Config', 'mmo/world_boss.json':'👹 World Boss' };
      panel.innerHTML = `<div class="form-section"><div class="form-section-title">${titles[fileName] || fileName}</div></div>`;
      if (fileName === 'mmo/world_boss.json') this.renderWorldBossEditor(file.data, panel);
      else this.renderGenericObj(file.data, panel, []);
      return;
    }

    if (!arr || arr.length === 0) {
      panel.className = 'editor-panel empty-state';
      panel.innerHTML = `<div class="empty-icon">📭</div><p>此文件暂无条目</p>
        <button class="btn btn-sm" onclick="app.showNewEntryDialog()">➕ 新增条目</button>`;
      return;
    }
    if (this.currentEntryIdx < 0 || this.currentEntryIdx >= arr.length) {
      panel.className = 'editor-panel empty-state';
      panel.innerHTML = `<div class="empty-icon">👆</div><p>请从左侧选择一个条目</p>`;
      return;
    }

    const entry = arr[this.currentEntryIdx];
    panel.className = 'editor-panel';
    panel.innerHTML = '';

    // 通用字段渲染
    const baseSection = document.createElement('div');
    baseSection.className = 'form-section';
    const title = document.createElement('div');
    title.className = 'form-section-title';
    title.innerHTML = `🗂️ ${escHtml(this.getEntryName(entry))}`;
    baseSection.appendChild(title);
    const fieldsDiv = document.createElement('div');
    baseSection.appendChild(fieldsDiv);
    panel.appendChild(baseSection);
    this.renderGenericObj(entry, fieldsDiv, [fileName]);

    // 特殊编辑器
    if (fileName === 'scenarios.json') this.renderScenarioSpecial(entry, panel);
    else if (fileName === 'shop_items.json') this.renderShopSpecial(entry, panel);
    else if (fileName === 'mmo/mmo_mobs.json') this.renderMobSpecial(entry, panel);
    else if (fileName === 'craft_recipes.json') this.renderRecipeSpecial(entry, panel);
    else if (fileName === 'quests.json') this.renderQuestSpecial(entry, panel);
    else if (fileName === 'mmo/world_spawns.json') this.renderWorldSpawnSpecial(entry, panel);
    else if (fileName === 'npcs.json' && entry.dialogs && Array.isArray(entry.dialogs)) this.renderDialogEditor(entry, panel);
  }

  // ====== 通用对象字段渲染 ======
  renderGenericObj(obj, container, pathPrefix) {
    if (!obj || typeof obj !== 'object') return;
    for (const [key, value] of Object.entries(obj)) {
      if (key === 'dialogs' && this.currentFile === 'npcs.json') continue; // dialog 特殊处理
      if (key === 'waves' && this.currentFile === 'scenarios.json') continue;
      if (key === 'spawn_points' && this.currentFile === 'scenarios.json') continue;
      if (key === 'objectives' && this.currentFile === 'scenarios.json') continue;
      if (key === 'reward' && this.currentFile === 'scenarios.json') continue;
      if (key === 'items' && this.currentFile === 'shop_items.json') continue;
      if (key === 'drops' && this.currentFile === 'mmo/mmo_mobs.json') continue;
      if (key === 'gold_reward' && this.currentFile === 'mmo/mmo_mobs.json') continue;
      if (key === 'ingredients' && this.currentFile === 'craft_recipes.json') continue;
      if (key === 'steps' && this.currentFile === 'quests.json') continue;
      if (key === 'spawns' && this.currentFile === 'mmo/world_spawns.json') continue;
      const row = this.createFieldRow(key, value, [...pathPrefix, key], obj);
      if (row) container.appendChild(row);
    }
  }

  // ====== 创建字段行 ======
  createFieldRow(key, value, path, parentObj) {
    const row = document.createElement('div');
    row.className = 'field-row';
    const label = document.createElement('div');
    label.className = 'field-label';
    const typeLabel = Array.isArray(value) ? `array[${value.length}]` : (value===null?'null':typeof value);
    label.innerHTML = `${escHtml(humanizeField(key))} <span class="field-type">${typeLabel}</span>`;

    // 字段描述
    const descKey = this.currentFile+'.'+path.slice(-2).join('.');
    const descKey2 = this.currentFile+'.'+path.slice(-1)[0];
    const desc = FIELD_DESCS[descKey] || FIELD_DESCS[descKey2];
    if (desc) label.innerHTML += `<span class="field-desc">${escHtml(desc)}</span>`;
    row.appendChild(label);

    const inputWrap = document.createElement('div');
    inputWrap.className = 'field-input';

    // 枚举
    const enumKey = path.slice(-1)[0];
    const isEnum = KNOWN_ENUMS[`${this.currentFile}.${enumKey}`] !== undefined;
    if (isEnum && (typeof value === 'string' || typeof value === 'number')) {
      const options = KNOWN_ENUMS[`${this.currentFile}.${enumKey}`];
      const sel = document.createElement('select');
      sel.innerHTML = '<option value="">— 选择 —</option>';
      for (const opt of options) {
        const o = document.createElement('option');
        o.value = opt;
        o.textContent = opt;
        if (String(value) === opt || String(value) === opt.split(':')[0]) o.selected = true;
        sel.appendChild(o);
      }
      sel.addEventListener('change', () => {
        const v = sel.value;
        parentObj[key] = typeof value === 'number' ? parseInt(v,10)||0 : v;
        this.markDirty();
      });
      inputWrap.appendChild(sel);
    }
    // 跨文件引用
    else if (typeof value === 'string' || typeof value === 'number') {
      const refPath = path.join('.');
      let refKey = `${this.currentFile}.${refPath}`;
      let ref = FIELD_REFS[refKey];
      // Try broader patterns: remove numeric indices
      if (!ref) {
        const pattern = refPath.replace(/\.\d+\./g,'.').replace(/\.\d+$/,'');
        ref = FIELD_REFS[pattern] || FIELD_REFS[`${this.currentFile}.${pattern}`];
        if (!ref) {
          // Try last two segments
          const last2 = path.slice(-2).join('.');
          ref = FIELD_REFS[last2] || FIELD_REFS[`${this.currentFile}.${last2}`];
        }
      }
      if (ref) {
        const refData = this.getRefData(ref.file);
        const sel = document.createElement('select');
        sel.innerHTML = '<option value="">— 选择 —</option>';
        for (const item of refData) {
          const idStr = String(item[ref.idKey] ?? '');
          const labelStr = item[ref.labelKey] ? String(item[ref.labelKey]) : idStr;
          const o = document.createElement('option');
          o.value = idStr;
          o.textContent = `${labelStr} (${idStr})`;
          if (String(value) === idStr) o.selected = true;
          sel.appendChild(o);
        }
        sel.addEventListener('change', () => {
          const v = sel.value;
          parentObj[key] = typeof value === 'number' ? (parseInt(v,10)||0) : v;
          this.markDirty();
        });
        inputWrap.appendChild(sel);
      }
      // 文本/数字
      else if (typeof value === 'string') {
        const ta = document.createElement('textarea');
        ta.value = value;
        ta.rows = Math.min(3, Math.max(1, Math.ceil((value.match(/\n/g)||[]).length)+1));
        ta.addEventListener('change', () => { parentObj[key] = ta.value; this.markDirty(); });
        inputWrap.appendChild(ta);
      } else if (typeof value === 'number') {
        const inp = document.createElement('input');
        inp.type = 'number';
        inp.step = Number.isInteger(value) ? '1' : '0.1';
        inp.value = String(value);
        inp.addEventListener('change', () => {
          const n = inp.step === '1' ? parseInt(inp.value,10) : parseFloat(inp.value);
          parentObj[key] = isNaN(n) ? value : n;
          this.markDirty();
        });
        inputWrap.appendChild(inp);
      }
    }
    else if (typeof value === 'boolean') {
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = value;
      cb.addEventListener('change', () => { parentObj[key] = cb.checked; this.markDirty(); });
      const lbl = document.createElement('label');
      lbl.style.cssText = 'display:flex;align-items:center;gap:6px;cursor:pointer';
      lbl.appendChild(cb);
      lbl.appendChild(document.createTextNode(value ? 'true' : 'false'));
      inputWrap.appendChild(lbl);
    }
    else if (value === null) {
      const inp = document.createElement('input');
      inp.type = 'text';
      inp.placeholder = 'null';
      inp.addEventListener('change', () => { parentObj[key] = inp.value || null; this.markDirty(); });
      inputWrap.appendChild(inp);
    }
    else if (Array.isArray(value)) {
      if (value.length > 0 && typeof value[0] === 'object' && value[0] !== null && !Array.isArray(value[0])) {
        inputWrap.appendChild(this.createArrayTableEditor(value, key, parentObj, path));
      } else if (value.length > 0 && typeof value[0] === 'string') {
        inputWrap.appendChild(this.createStringArrayEditor(value, key, parentObj));
      } else {
        const inp = document.createElement('input');
        inp.type = 'text';
        inp.value = JSON.stringify(value);
        inp.placeholder = 'JSON array';
        inp.addEventListener('change', () => {
          try { parentObj[key] = JSON.parse(inp.value); this.markDirty(); } catch(e) { inp.style.borderColor='var(--danger)'; }
        });
        inputWrap.appendChild(inp);
      }
    }
    else if (typeof value === 'object') {
      inputWrap.appendChild(this.createNestedEditor(value, key, parentObj, path));
    }

    row.appendChild(inputWrap);
    return row;
  }

  // ====== 对象数组表格编辑器 ======
  createArrayTableEditor(arr, parentKey, parentObj, path) {
    const wrap = document.createElement('div');
    wrap.style.width = '100%';
    const table = document.createElement('table');
    table.className = 'array-table';
    const keys = new Set();
    for (const item of arr) { if (item && typeof item === 'object') Object.keys(item).forEach(k => keys.add(k)); }
    const keyList = Array.from(keys);
    const thead = document.createElement('thead');
    const tr = document.createElement('tr');
    for (const k of keyList) {
      const th = document.createElement('th');
      th.textContent = k;
      tr.appendChild(th);
    }
    const thAct = document.createElement('th');
    thAct.style.width = '40px';
    thAct.textContent = '操作';
    tr.appendChild(thAct);
    thead.appendChild(tr);
    table.appendChild(thead);

    const tbody = document.createElement('tbody');
    for (let i = 0; i < arr.length; i++) {
      const item = arr[i];
      const tr2 = document.createElement('tr');
      for (const k of keyList) {
        const td = document.createElement('td');
        const v = item[k];
        // 检测是否跨文件引用
        const refPath = [...path.slice(0,-1), parentKey, i, k].join('.');
        let refPattern = `${this.currentFile}.${refPath}`;
        let ref = FIELD_REFS[refPattern];
        if (!ref) {
          // fuzzy match
          const fuzzy = `${this.currentFile}.${parentKey}.${k}`;
          ref = FIELD_REFS[fuzzy];
          if (!ref) {
            // try broader
            for (const rk of Object.keys(FIELD_REFS)) {
              if (rk.endsWith('.'+k) && rk.startsWith(this.currentFile+'.')) { ref = FIELD_REFS[rk]; break; }
            }
          }
        }
        if (typeof v === 'number') {
          const inp = document.createElement('input');
          inp.type = 'number';
          inp.step = Number.isInteger(v) ? '1' : '0.1';
          inp.value = String(v);
          inp.addEventListener('change', () => { item[k] = isNaN(parseFloat(inp.value)) ? v : (inp.step==='1'?parseInt(inp.value,10):parseFloat(inp.value)); this.markDirty(); });
          td.appendChild(inp);
        } else if (typeof v === 'boolean') {
          const cb = document.createElement('input');
          cb.type = 'checkbox';
          cb.checked = v;
          cb.addEventListener('change', () => { item[k] = cb.checked; this.markDirty(); });
          td.appendChild(cb);
        } else if (ref) {
          // 引用下拉
          const refData = this.getRefData(ref.file);
          const sel = document.createElement('select');
          sel.innerHTML = '<option value="">— 选择 —</option>';
          for (const ri of refData) {
            const idStr = String(ri[ref.idKey]??'');
            const lbl = ri[ref.labelKey] ? String(ri[ref.labelKey]) : idStr;
            const o = document.createElement('option');
            o.value = idStr;
            o.textContent = `${lbl} (${idStr})`;
            if (String(v) === idStr) o.selected = true;
            sel.appendChild(o);
          }
          sel.addEventListener('change', () => { item[k] = typeof v==='number'?(parseInt(sel.value,10)||0):sel.value; this.markDirty(); });
          td.appendChild(sel);
        } else {
          const inp = document.createElement('input');
          inp.type = 'text';
          inp.value = String(v ?? '');
          inp.addEventListener('change', () => { item[k] = inp.value; this.markDirty(); });
          td.appendChild(inp);
        }
        tr2.appendChild(td);
      }
      // 删除按钮
      const tdAct = document.createElement('td');
      const delBtn = document.createElement('button');
      delBtn.className = 'btn-icon btn-sm';
      delBtn.textContent = '✕';
      delBtn.style.cssText = 'color:var(--danger);cursor:pointer';
      delBtn.addEventListener('click', () => { arr.splice(i,1); this.markDirty(); this.renderEditor(); });

  // ====== 字符串数组编辑器 ======
  createStringArrayEditor(arr, key, parentObj) {
    const wrap = document.createElement('div');
    wrap.className = 'tag-input-wrap';
    const renderTags = () => {
      wrap.innerHTML = '';
      for (let i = 0; i < arr.length; i++) {
        const tag = document.createElement('span');
        tag.className = 'tag-item';
        tag.innerHTML = `${escHtml(arr[i])}<span class="tag-remove" data-idx="${i}">×</span>`;
        tag.querySelector('.tag-remove').addEventListener('click', () => { arr.splice(i,1); this.markDirty(); renderTags(); });
        wrap.appendChild(tag);
      }
      const inp = document.createElement('input');
      inp.className = 'tag-input-field';
      inp.placeholder = '输入后回车...';
      inp.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && inp.value.trim()) {
          arr.push(inp.value.trim());
          this.markDirty();
          inp.value = '';
          renderTags();
        }
      });
      wrap.appendChild(inp);
    };
    renderTags();
    return wrap;
  }

  createNestedEditor(obj, key, parentObj, path) {

  renderArrayTable(tbodyId, arr, columns) {
    const tbody = document.getElementById(tbodyId);
    if (!tbody) return;
    tbody.innerHTML = '';
    if (!arr) return;
    for (let i = 0; i < arr.length; i++) {
      const tr = document.createElement('tr');
      for (const col of columns) {
        const td = document.createElement('td');
        const v = arr[i][col];
        const inp = document.createElement('input');
        inp.type = typeof v === 'number' ? 'number' : 'text';
        if (typeof v === 'number') { inp.step = Number.isInteger(v) ? '1' : '0.1'; }
        inp.value = String(v ?? '');
        inp.addEventListener('change', () => {
          arr[i][col] = typeof v === 'number' ? (isNaN(parseFloat(inp.value))?0:(inp.step==='1'?parseInt(inp.value,10):parseFloat(inp.value))) : inp.value;
          this.markDirty();
        });
        td.appendChild(inp);
        tr.appendChild(td);
      }
      const tdAct = document.createElement('td');
      const del = document.createElement('button');
      del.className = 'btn-icon btn-sm';
      del.textContent = '✕';
      del.style.cssText = 'color:var(--danger);cursor:pointer';
      del.addEventListener('click', () => { arr.splice(i,1); this.markDirty(); this.renderEditor(); });
      tdAct.appendChild(del);
      tr.appendChild(tdAct);
      tbody.appendChild(tr);
    }
  }

  renderQuestSteps(container, steps) {
    const table = document.createElement('table');
    table.className = 'array-table';
    table.innerHTML = `<thead><tr><th>类型</th><th>NPC/目标 ID</th><th>数量</th><th>描述</th><th style="width:40px;">操作</th></tr></thead><tbody></tbody>`;
    container.appendChild(table);
    const tbody = table.querySelector('tbody');
    if (!tbody) return;
    for (let i = 0; i < steps.length; i++) {
      const step = steps[i];
      const tr = document.createElement('tr');
      // Type
      const td1 = document.createElement('td');
      const sel = document.createElement('select');
      const types = ['talk_npc','kill','mine','craft','reach_area','collect'];
      sel.innerHTML = types.map(t => `<option value="${t}" ${step.type===t?'selected':''}>${t}</option>`).join('');
      sel.addEventListener('change', () => { step.type = sel.value; this.markDirty(); });
      td1.appendChild(sel);
      tr.appendChild(td1);
      // NPC / target_id
      const td2 = document.createElement('td');
      const inpNpc = document.createElement('input');
      inpNpc.type = 'text';
      inpNpc.value = String(step.npc ?? step.target_id ?? '');
      inpNpc.addEventListener('change', () => { step.npc = inpNpc.value; this.markDirty(); });
      td2.appendChild(inpNpc);
      tr.appendChild(td2);
      // Count
      const td3 = document.createElement('td');
      const inpCnt = document.createElement('input');
      inpCnt.type = 'number'; inpCnt.step = '1'; inpCnt.value = String(step.count ?? 1);
      inpCnt.addEventListener('change', () => { step.count = parseInt(inpCnt.value,10)||1; this.markDirty(); });
      td3.appendChild(inpCnt);
      tr.appendChild(td3);
      // Description
      const td4 = document.createElement('td');
      const inpDesc = document.createElement('input');
      inpDesc.type = 'text';
      inpDesc.value = String(step.description ?? '');
      inpDesc.addEventListener('change', () => { step.description = inpDesc.value; this.markDirty(); });
      td4.appendChild(inpDesc);
      tr.appendChild(td4);
      // Delete
      const tdAct = document.createElement('td');
      const del = document.createElement('button');
      del.className = 'btn-icon btn-sm';
      del.textContent = '✕';
      del.style.cssText = 'color:var(--danger);cursor:pointer';
      del.addEventListener('click', () => { steps.splice(i,1); this.markDirty(); this.renderEditor(); });
      tdAct.appendChild(del);
      tr.appendChild(tdAct);
      tbody.appendChild(tr);
    }
    const addBtn = document.createElement('button');
    addBtn.className = 'add-btn';
    addBtn.innerHTML = '➕ 添加步骤';
    addBtn.addEventListener('click', () => {
      steps.push({ type:'talk_npc', npc:'', count:1, description:'' });
      this.markDirty();
      this.renderEditor();
    });
    container.appendChild(addBtn);
  }

  // ====== 特殊编辑器: World Spawns ======
  renderWorldSpawnSpecial(entry, panel) {
    const sec = document.createElement('div');
    sec.className = 'form-section';
    sec.innerHTML = `<div class="special-section-title">🦎 怪物刷新点 (Mob Spawns)</div>`;
    if (!entry.spawns) entry.spawns = [];
    this.renderMiniRefTable(sec, entry.spawns, [
      {key:'def_id', ref:{file:'mmo/mmo_mobs.json',idKey:'id',labelKey:'name'}},
      'x','y','respawn_delay','min_dist'
    ]);
    panel.appendChild(sec);
  }

  // ====== NPC 对话编辑器 ======
  renderDialogEditor(entry, container) {
    const dialogs = entry.dialogs;
    if (!dialogs || dialogs.length === 0) {
      const empty = document.createElement('div');
      empty.innerHTML = `<div class="form-section-title">💬 对话树 (Dialogs)</div>
        <div style="color:var(--text-muted);padding:12px 0">(无对话节点)</div>`;
      const addBtn = document.createElement('button');
      addBtn.className = 'add-btn';
      addBtn.innerHTML = '➕ 添加对话节点';
      addBtn.addEventListener('click', () => { entry.dialogs.push({ id:'', text:'', conditions:{}, actions:[] }); this.markDirty(); this.renderEditor(); });
      empty.appendChild(addBtn);
      container.appendChild(empty);
      return;
    }

    const editor = document.createElement('div');
    editor.className = 'dialog-editor';
    
    // ── View toggle ──
    const viewKey = '_dialog_view_graph_';
    if (this[viewKey] === undefined) this[viewKey] = false;
    const title = document.createElement('div');
    title.className = 'form-section-title';
    title.innerHTML = `💬 对话树 (Dialogs)`;
    const viewToggle = document.createElement('div');
    viewToggle.style.cssText = 'margin-left:auto;display:flex;gap:4px';
    const makeTBtn = (label, isActive, clickFn) => {
      const b = document.createElement('button');
      b.className = 'btn btn-sm';
      b.textContent = label;
      b.style.cssText = `padding:2px 8px;font-size:10px;background:${isActive?'var(--accent)':'transparent'};color:${isActive?'#fff':'var(--text-secondary)'};border:1px solid ${isActive?'var(--accent)':'var(--border)'}`;
      b.addEventListener('click', clickFn);
      return b;
    };
    const isGraph = this[viewKey];
    const storyMapKey = '_show_story_map_';
    if (this[storyMapKey] === undefined) this[storyMapKey] = false;
    const isStoryMap = this[storyMapKey];
    title.appendChild(makeTBtn('📋 列表', !isGraph && !isStoryMap, () => { this[storyMapKey] = false; this[viewKey] = false; this.renderEditor(); }));
    title.appendChild(makeTBtn('🎯 图形', isGraph && !isStoryMap, () => { this[storyMapKey] = false; this[viewKey] = true; this.renderEditor(); }));
    title.appendChild(makeTBtn('🌐 全局故事线', isStoryMap, () => { this[storyMapKey] = !this[storyMapKey]; this[viewKey] = false; this.renderEditor(); }));
    title.appendChild(makeTBtn('✨ 快速NPC', false, () => { this.showQuickNPCDialog(); }));
    editor.appendChild(title);

    // ── 对话模拟 ──
    const simKey = '_dialog_sim_';
    if (this[simKey] === undefined) this[simKey] = false;
    const simBar = document.createElement('div');
    simBar.style.cssText = 'display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap';
    const simBtn = document.createElement('button');
    simBtn.style.cssText = `padding:2px 10px;font-size:10px;border-radius:var(--radius-sm);cursor:pointer;border:1px solid var(--border);background:${this[simKey]?'var(--accent)':'transparent'};color:${this[simKey]?'#fff':'var(--text-secondary)'}`;
    simBtn.innerHTML = this[simKey] ? '⏹ 结束模拟' : '▶ 模拟对话';
    simBtn.addEventListener('click', () => { this[simKey] = !this[simKey]; this.renderEditor(); });
    simBar.appendChild(simBtn);
    if (this[simKey]) {
      const simStatus = document.createElement('span');
      simStatus.style.cssText = 'font-size:10px;color:var(--text-muted)';
      simStatus.textContent = '模拟模式 — 点击对话项查看玩家视角';
      simBar.appendChild(simStatus);
    }
    editor.appendChild(simBar);

    // ── 模拟视图 ──
    if (this[simKey]) {
      // Simulate: evaluate conditions and show only reachable steps
      const simStateKey = '_dialog_sim_flags_';
      if (!this[simStateKey]) this[simStateKey] = {}; // { flagName: value }
      if (!this['_dialog_sim_gold_']) this['_dialog_sim_gold_'] = 0;
      if (!this['_dialog_sim_level_']) this['_dialog_sim_level_'] = 1;
      if (!this['_dialog_sim_reputation_']) this['_dialog_sim_reputation_'] = 0;

      // Sim control bar
      const simCtrl = document.createElement('div');
      simCtrl.style.cssText = 'display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:8px;padding:6px 8px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-sm)';
      simCtrl.innerHTML = `
        <span style="font-size:10px;color:var(--text-muted)">🎭 玩家状态:</span>
        <span style="font-size:10px;color:var(--text-secondary)">🏅 Lv<span id="simLvl">${this['_dialog_sim_level_']}</span></span>
        <span style="font-size:10px;color:var(--text-secondary)">💰 <span id="simGold">${this['_dialog_sim_gold_']}</span></span>
        <span style="font-size:10px;color:var(--text-secondary)">⭐ <span id="simRep">${this['_dialog_sim_reputation_']}</span></span>
        <span style="font-size:10px;color:var(--text-muted)">🚩 <span id="simFlags">${Object.keys(this[simStateKey]).length}</span></span>
      `;
      simCtrl.appendChild(document.createElement('div'));
      // Player editing controls
      const editRow = document.createElement('div');
      editRow.style.cssText = 'display:flex;align-items:center;gap:4px;margin-top:2px;flex-wrap:wrap';
      const lvlInp = document.createElement('input');
      lvlInp.type = 'number'; lvlInp.min = 1; lvlInp.max = 99;
      lvlInp.style.cssText = 'width:50px;padding:1px 4px;background:var(--bg-input);border:1px solid var(--border);border-radius:3px;color:var(--text-primary);font-size:9px;outline:none';
      lvlInp.value = this['_dialog_sim_level_'];
      lvlInp.placeholder = '等级';
      lvlInp.addEventListener('change', () => { this['_dialog_sim_level_'] = parseInt(lvlInp.value) || 1; this.renderEditor(); });
      editRow.innerHTML = '<span style="font-size:9px;color:var(--text-muted)">等级:</span>';
      editRow.appendChild(lvlInp);
      const resetFlagBtn = document.createElement('button');
      resetFlagBtn.style.cssText = 'font-size:9px;padding:1px 8px;background:transparent;border:1px dashed var(--border);border-radius:3px;color:var(--text-muted);cursor:pointer';
      resetFlagBtn.textContent = '🔄 重置标记';
      resetFlagBtn.addEventListener('click', () => {
        this[simStateKey] = {};
        this['_dialog_sim_gold_'] = 0;
        this['_dialog_sim_level_'] = 1;
        this['_dialog_sim_reputation_'] = 0;
        this.renderEditor();
      });
      editRow.appendChild(resetFlagBtn);
      // Toggle flag buttons
      if (Object.keys(this[simStateKey]).length > 0) {
        const flagBar = document.createElement('div');
        flagBar.style.cssText = 'display:flex;align-items:center;gap:3px;flex-wrap:wrap;margin-top:4px;width:100%';
        flagBar.innerHTML = '<span style="font-size:9px;color:var(--text-muted)">标记:</span>';
        for (const [fk, fv] of Object.entries(this[simStateKey])) {
          const tag = document.createElement('span');
          tag.style.cssText = 'font-size:8px;padding:1px 6px;background:rgba(63,185,80,.15);color:var(--success);border-radius:3px;cursor:pointer;border:1px solid rgba(63,185,80,.3)';
          tag.textContent = fk + (fv > 1 ? '='+fv : '');
          tag.title = '点击切换';
          tag.addEventListener('click', () => {
            if (this[simStateKey][fk] > 0) {
              delete this[simStateKey][fk];
            } else {
              this[simStateKey][fk] = 1;
            }
            this.renderEditor();
          });
          flagBar.appendChild(tag);
        }
        // Manually add flag
        const addFlagSel = document.createElement('select');
        addFlagSel.style.cssText = 'font-size:8px;padding:1px 3px;background:var(--bg-tertiary);border:1px solid var(--border);border-radius:3px;color:var(--text-muted);outline:none';
        const allFlags = this.collectStoryFlags();
        let flagOpts = '<option value="">+ 标记...</option>';
        for (const f of allFlags.filter(f => !(f in this[simStateKey]))) flagOpts += `<option value="${f}">${f}</option>`;
        addFlagSel.innerHTML = flagOpts;
        addFlagSel.addEventListener('change', () => {
          if (addFlagSel.value) {
            this[simStateKey][addFlagSel.value] = 1;
            this.renderEditor();
          }
        });
        flagBar.appendChild(addFlagSel);
        editRow.appendChild(flagBar);
      }
      simCtrl.appendChild(editRow);
      editor.appendChild(simCtrl);

      // Evaluate conditions: show only steps whose conditions are met
      function evalSimCond(d) {
        const c = d.conditions || {};
        // flag check
        if (c.flag) {
          const val = this[simStateKey][c.flag];
          if (!val || val <= 0) return false;
        }
        // not_flag check
        if (c.not_flag) {
          const val = this[simStateKey][c.not_flag];
          if (val && val > 0) return false;
        }
        // level_ge
        if (c.level_ge && this['_dialog_sim_level_'] < c.level_ge) return false;
        // level_eq
        if (c.level_eq && this['_dialog_sim_level_'] !== c.level_eq) return false;
        // reputation_ge
        if (c.reputation_ge && this['_dialog_sim_reputation_'] < c.reputation_ge) return false;
        // gold_ge
        if (c.gold_ge && this['_dialog_sim_gold_'] < c.gold_ge) return false;
        // probability
        if (c.probability && Math.random() * 100 > c.probability) return false;
        return true;
      }

      const reachable = dialogs.filter(d => evalSimCond.call(this, d));

      if (reachable.length === 0) {
        const emptySim = document.createElement('div');
        emptySim.style.cssText = 'color:var(--text-muted);padding:20px;text-align:center;font-size:12px';
        emptySim.textContent = '当前条件下没有任何可触发的对话步骤。试试修改玩家状态。';
        editor.appendChild(emptySim);
      } else {
        for (let si = 0; si < reachable.length; si++) {
          const rd = reachable[si];
          const isFirst = si === 0;
          const msgBox = document.createElement('div');
          msgBox.style.cssText = `margin-bottom:6px;padding:8px 10px;border-radius:var(--radius);background:${isFirst?'var(--bg-card)':'var(--bg-tertiary)'};border:1px solid var(--border);border-left:3px solid ${isFirst?'var(--accent)':'var(--border)'}`;

          // NPC name label
          const who = document.createElement('div');
          who.style.cssText = 'font-size:10px;font-weight:600;color:var(--purple);margin-bottom:3px';
          who.textContent = `${escHtml(entry.id || entry.name || 'NPC')} » ${escHtml(rd.id)}`;
          msgBox.appendChild(who);

          const textLines = Array.isArray(rd.text) ? rd.text : [rd.text || ''];
          for (let ti = 0; ti < textLines.length; ti++) {
            const line = document.createElement('div');
            line.style.cssText = 'font-size:11px;color:var(--text-primary);padding:2px 0;' + (ti === 0 ? '' : 'opacity:.7');
            line.textContent = textLines[ti];
            msgBox.appendChild(line);
          }

          // Actions to execute when player "clicks"
          const actBar = document.createElement('div');
          actBar.style.cssText = 'display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-top:6px;padding-top:4px;border-top:1px solid var(--border)';
          const actBtn = document.createElement('button');
          actBtn.style.cssText = 'padding:2px 10px;font-size:9px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);cursor:pointer';
          actBtn.textContent = isFirst ? '▶ 执行此对话' : '▶ 执行';
          actBtn.addEventListener('click', () => {
            // Apply actions
            if (rd.actions) {
              for (const a of rd.actions) {
                if (a.type === 'set_flag' && a.key) {
                  this[simStateKey][a.key] = a.value !== undefined ? a.value : 1;
                }
                if (a.type === 'clear_flag' && a.key) {
                  delete this[simStateKey][a.key];
                }
                if (a.type === 'add_gold' && a.value) {
                  this['_dialog_sim_gold_'] += a.value;
                }
                if (a.type === 'add_reputation' && a.value) {
                  this['_dialog_sim_reputation_'] += a.value;
                }
                if (a.type === 'heal') {
                  // No-op in sim
                }
              }
            }
            this.renderEditor();
          });
          actBar.appendChild(actBtn);

          // Show action preview
          if (rd.actions && rd.actions.length > 0) {
            const actPreview = document.createElement('span');
            actPreview.style.cssText = 'font-size:8px;color:var(--text-muted)';
            const acts = rd.actions.map(a => {
              if (a.type === 'set_flag') return `🏴 ${a.key}${a.value!==undefined?'='+a.value:''}`;
              if (a.type === 'add_gold') return `💰 +${a.value}`;
              if (a.type === 'add_reputation') return `⭐ +${a.value}`;
              if (a.type === 'heal') return `❤️ +${a.value||'满'}`;
              if (a.type === 'heal_mp') return `💙 +${a.value||'满'}`;
              if (a.type === 'teleport') return `📡 → ${a.key}(${a.value})`;
              if (a.type === 'start_quest') return `📜 接任务:${a.key}`;
              if (a.type === 'complete_quest') return `✅ 完成任务:${a.key}`;
              if (a.type === 'add_item') return `📦 +${a.value||1}x ${a.key}`;
              if (a.type === 'remove_item') return `📦 -${a.value||1}x ${a.key}`;
              if (a.type === 'message') return `💬 ${(a.value||a.message||'').slice(0,15)}`;
              return a.type;
            }).join(' · ');
            actPreview.textContent = '→ ' + acts;
            actBar.appendChild(actPreview);
          }

          msgBox.appendChild(actBar);
          editor.appendChild(msgBox);
        }
      }

      container.appendChild(editor);
      return; // Skip rest of renderDialogEditor
    }

    // ── 对话模板 ──
    const templates = [
      { name:'📜 任务接取', desc:'NPC发任务+设flag', gen:(id) => [
        { id:'intro', text:['...','[按ESC查看任务]'], conditions:{}, actions:[{ type:'start_quest', key:'', value:0 }, { type:'set_flag', key:id+'_quest_started', value:1 }] },
        { id:'progress', text:['你还没完成这个任务。'], conditions:{ flag:id+'_quest_started', not_flag:id+'_quest_done' }, actions:[] },
        { id:'done', text:['谢谢你! 这是你的奖励。'], conditions:{ flag:id+'_quest_done' }, actions:[{ type:'add_reputation', value:10, message:'声望+10' }] },
      ]},
      { name:'📖 剧情推进', desc:'Flag条件→新对话→设flag', gen:(id) => [
        { id:'trigger', text:['...'], conditions:{ not_flag:id+'_flag' }, actions:[{ type:'set_flag', key:id+'_flag', value:1 }] },
        { id:'after', text:['你已经听过这个故事了。'], conditions:{ flag:id+'_flag' }, actions:[] },
      ]},
      { name:'🏪 商店NPC', desc:'卖东西的NPC', gen:(id) => [
        { id:'greeting', text:['欢迎光临!', '有什么需要的吗?'], conditions:{}, actions:[{ type:'open_shop', key:id }] },
      ]},
      { name:'⚡ 技能导师', desc:'教技能的NPC', gen:(id) => [
        { id:'learn', text:['你想学什么技能?', '[按ESC → 技能页]'], conditions:{}, actions:[{ type:'open_skills' }] },
      ]},
      { name:'🛏️ 治疗点', desc:'免费回血', gen:(id) => [
        { id:'rest', text:['你休息了一会儿...', '感觉好多了。'], conditions:{}, actions:[{ type:'heal', value:50 }, { type:'message', message:'生命值已恢复' }] },
      ]},
      { name:'🔧 打造台', desc:'打开打造界面', gen:(id) => [
        { id:'craft', text:['你想打造什么?', '[按ESC → 打造页]'], conditions:{}, actions:[{ type:'open_craft' }] },
      ]},
    ];
    const tplRow = document.createElement('div');
    tplRow.style.cssText = 'display:flex;align-items:center;gap:4px;margin-bottom:6px;flex-wrap:wrap';
    const tplLabel = document.createElement('span');
    tplLabel.style.cssText = 'font-size:10px;color:var(--text-muted);white-space:nowrap';
    tplLabel.textContent = '📋 模板:';
    tplRow.appendChild(tplLabel);
    const tplSel = document.createElement('select');
    tplSel.style.cssText = 'flex:1;min-width:120px;padding:2px 6px;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-primary);font-size:10px;outline:none';
    tplSel.innerHTML = '<option value="">— 选模板预填对话 —</option>' + templates.map((t,i) => `<option value="${i}">${t.name} — ${t.desc}</option>`).join('');
    const tplDesc = document.createElement('span');
    tplDesc.style.cssText = 'font-size:9px;color:var(--text-muted);font-style:italic';
    const applyTpl = () => {
      const idx = parseInt(tplSel.value);
      if (isNaN(idx) || !templates[idx]) return;
      const tpl = templates[idx];
      const npcId = entry.id || 'npc';
      const stepId = 'step' + (dialogs.length + 1);
      const genSteps = tpl.gen(stepId);
      for (const s of genSteps) dialogs.push(s);
      tplSel.value = '';
      this.markDirty();
      this['_show_story_map_'] = false;
      this.renderEditor();
    };
    tplSel.addEventListener('change', applyTpl);
    tplRow.appendChild(tplSel);
    editor.appendChild(tplRow);

    // ── Dialog text search ──
    const searchKey = '_dialog_search_';
    const searchRow = document.createElement('div');
    searchRow.style.cssText = 'display:flex;align-items:center;gap:4px;margin-bottom:6px';
    const searchInp = document.createElement('input');
    searchInp.type = 'text';
    searchInp.value = this[searchKey] || '';
    searchInp.placeholder = '🔍 在所有NPC对话中搜索... (回车)';
    searchInp.style.cssText = 'flex:1;padding:3px 8px;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-primary);font-size:11px;outline:none';
    const searchResults = document.createElement('div');
    searchResults.style.cssText = 'font-size:10px;color:var(--text-muted);margin-bottom:6px';
    const doSearch = () => {
      const q = searchInp.value.trim().toLowerCase();
      this[searchKey] = q;
      if (!q) { searchResults.innerHTML = ''; return; }
      const allNpcs = this.getRefData('npcs.json') || [];
      let hits = [];
      for (const npc of allNpcs) {
        if (!npc.dialogs) continue;
        for (const d of npc.dialogs) {
          const lines = Array.isArray(d.text) ? d.text : [d.text || ''];
          for (const l of lines) {
            if (l.toLowerCase().includes(q)) {
              hits.push({ npc: npc.id, step: d.id, text: l });
            }
          }
        }
      }
      if (hits.length === 0) {
        searchResults.innerHTML = '🔍 无结果';
      } else {
        searchResults.innerHTML = hits.map(h =>
          `<div style="padding:2px 4px;cursor:pointer;color:var(--text-secondary);transition:background .1s"
                onmouseover="this.style.background='var(--bg-tertiary)'"
                onmouseout="this.style.background=''"
                onclick="app.selectNpcAndOpen('${escHtml(h.npc)}', ${dialogs.indexOf(d)})">
            <span style="color:var(--accent)">${escHtml(h.npc)}/${escHtml(h.step)}</span>: 
            ${escHtml(h.text.slice(0, 60))}
          </div>`
        ).join('');
      }
    };
    searchInp.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        doSearch();
        // Expand dialog that contains the search term if current NPC
        if (this[searchKey]) {
          for (let si = 0; si < dialogs.length; si++) {
            const lines = Array.isArray(dialogs[si].text) ? dialogs[si].text : [dialogs[si].text || ''];
            for (const l of lines) {
              if (l.toLowerCase().includes(this[searchKey])) {
                this['_dialog_expand_' + si] = true;
                break;
              }
            }
          }
          this.renderEditor();
        }
      }
    });
    searchRow.appendChild(searchInp);
    editor.appendChild(searchRow);
    editor.appendChild(searchResults);

    // Add selectNpcAndOpen helper
    if (!this.selectNpcAndOpen) {
      this.selectNpcAndOpen = (npcId, stepIdx) => {
        const allNpcs = this.getRefData('npcs.json') || [];
        const idx = allNpcs.findIndex(n => n.id === npcId);
        if (idx >= 0) {
          this.currentEntryIdx = idx;
          this['_show_story_map_'] = false;
          this[viewKey] = false;
          this.renderSidebar();
          this.renderEditor();
        }
      };
    }

    if (isStoryMap) {
      this.renderStoryMap(entry, editor, dialogs);
      container.appendChild(editor);
      return;
    }

    if (isGraph) {
      this.renderGraphView(entry, editor, dialogs);
      container.appendChild(editor);
      return;
    }

    for (let i = 0; i < dialogs.length; i++) {
      const d = dialogs[i];
      if (!d.conditions) d.conditions = {};
      if (!d.actions) d.actions = [];

      // ── Compact step row (like action layout) ──
      const row = document.createElement('div');
      row.style.cssText = 'display:flex;align-items:center;gap:5px;padding:4px 6px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:3px;flex-wrap:wrap';

      // Step # badge
      const badge = document.createElement('span');
      badge.style.cssText = 'font-size:10px;font-weight:600;color:var(--purple);min-width:22px;text-align:center';
      badge.textContent = '#' + (i+1);
      row.appendChild(badge);

      // ID input (small)
      const idInp = document.createElement('input');
      idInp.type = 'text'; idInp.value = d.id || '';
      idInp.placeholder = 'id';
      idInp.style.cssText = 'width:60px;padding:2px 5px;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-primary);font-size:10px;outline:none';
      idInp.addEventListener('change', () => { d.id = idInp.value; this.markDirty(); });
      row.appendChild(idInp);

      // Text preview (first line + line count)
      const textPreview = document.createElement('span');
      textPreview.style.cssText = 'flex:1;min-width:80px;font-size:10px;color:var(--text-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px';
      if (Array.isArray(d.text)) {
        textPreview.textContent = d.text.length > 0 ? (d.text[0] + (d.text.length > 1 ? ` … (${d.text.length}行)` : '')) : '(空文本)';
      } else {
        textPreview.textContent = d.text ? d.text.slice(0, 50) : '(空)';
      }
      row.appendChild(textPreview);

      // Collapse toggle
      const expandKey = '_dialog_expand_' + i;
      if (this[expandKey] === undefined) this[expandKey] = false;
      const toggleBtn = document.createElement('button');
      toggleBtn.className = 'btn-icon btn-sm';
      toggleBtn.textContent = this[expandKey] ? '🔽' : '▶';
      toggleBtn.title = this[expandKey] ? '折叠' : '展开条件和动作';
      toggleBtn.addEventListener('click', () => { this[expandKey] = !this[expandKey]; this.renderEditor(); });
      row.appendChild(toggleBtn);

      // Delete
      const delBtn = document.createElement('button');
      delBtn.className = 'btn-icon btn-sm';
      delBtn.textContent = '✕';
      delBtn.style.cssText = 'color:var(--danger);cursor:pointer';
      delBtn.addEventListener('click', () => { dialogs.splice(i,1); this.markDirty(); this.renderEditor(); });
      row.appendChild(delBtn);

      editor.appendChild(row);

      // ── Expanded: text lines + conditions + actions ──
      if (this[expandKey]) {
        const subContainer = document.createElement('div');
        subContainer.style.cssText = 'padding:4px 6px 4px 28px;margin-bottom:3px;border-left:2px solid var(--border);margin-left:4px';

        // Text lines (array of strings)
        const textLines = Array.isArray(d.text) ? d.text : [d.text || ''];
        const textLabel = document.createElement('div');
        textLabel.style.cssText = 'font-size:10px;font-weight:600;color:var(--text-primary);margin:4px 0 2px';
        textLabel.textContent = `文本 (${textLines.length} 行)`;
        subContainer.appendChild(textLabel);

        for (let ti = 0; ti < textLines.length; ti++) {
          const tRow = document.createElement('div');
          tRow.style.cssText = 'display:flex;align-items:center;gap:4px;padding:2px 0';
          const tIdx = document.createElement('span');
          tIdx.style.cssText = 'font-size:9px;color:var(--text-muted);min-width:16px;text-align:right';
          tIdx.textContent = '[' + ti + ']';
          tRow.appendChild(tIdx);
          const tInp = document.createElement('input');
          tInp.type = 'text'; tInp.value = textLines[ti];
          tInp.placeholder = '对话文本行...';
          tInp.style.cssText = 'flex:1;padding:2px 5px;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-primary);font-size:10px;outline:none';
          tInp.addEventListener('change', () => {
            textLines[ti] = tInp.value;
            d.text = textLines.length === 1 ? textLines[0] : textLines;
            this.markDirty();
          });
          tRow.appendChild(tInp);
          const tDel = document.createElement('button');
          tDel.className = 'btn-icon btn-sm'; tDel.textContent = '✕';
          tDel.style.cssText = 'color:var(--danger);cursor:pointer';
          tDel.addEventListener('click', () => {
            textLines.splice(ti, 1);
            d.text = textLines.length === 0 ? '' : (textLines.length === 1 ? textLines[0] : textLines);
            this.markDirty(); this.renderEditor();
          });
          tRow.appendChild(tDel);
          subContainer.appendChild(tRow);
        }

        const addT = document.createElement('button');
